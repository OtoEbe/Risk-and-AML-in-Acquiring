vanna Commercial Bank writes asking GhIPSS to compensate customers who paid late-payment penalties to suppliers, estimated at GHS 310,000. The failure began in Meridian's upgrade. Meridian says GhIPSS should have stopped it sooner.","data":[{"label":"Savanna's claim","value":"GHS 310,000"},{"label":"GIP rulebook position","value":"Each participant is liable for its own systems (illustrative)"},{"label":"Savanna's share of GIP volume","value":"14%"},{"label":"GhIPSS incident timeline","value":"Complete, timestamped from 09:52"}],"question":"What does Legal advise?","options":[{"key":"A","text":"Bring Savanna and Meridian together, apply the rulebook on liability, and share GhIPSS's incident timeline as evidence.","effects":{"capital":200000,"trust":8,"risk":-5,"ttl":0},"feedback":"With the timeline on the table the facts are not in dispute. Meridian accepts its share, Savanna sees GhIPSS acting for it, and the rulebook holds.","requires":{"meter":"trust","op":">=","value":45},"lockedReason":"Locked: Partner Trust below 45. Neither bank will sit at the same table with GhIPSS right now."},{"key":"B","text":"Pay Savanna's claim in full to protect a major participant, and recover what GhIPSS can from Meridian over time.","effects":{"capital":-310000,"trust":8,"risk":5,"ttl":0},"feedback":"Savanna is satisfied. Every participant now knows GhIPSS will pay for failures it did not cause, and Meridian has no reason to pay back."},{"key":"C","text":"Reject the claim in writing, citing the rulebook, and close the file since the failure began at Meridian Bank.","effects":{"capital":100000,"trust":-10,"risk":0,"ttl":0},"feedback":"Legally sound and commercially expensive. Savanna's head of payments starts asking what other routes exist for its larger transfers."},{"key":"D","text":"Offer Savanna a goodwill fee credit without admitting liability, and refer the liability question to the rules committee.","effects":{"capital":-100000,"trust":5,"risk":0,"ttl":0},"feedback":"Savanna accepts the gesture. The committee meets next quarter, and the same question will come back with the next incident."}]},"N4.1":{"id":"N4.1","kind":"spine","round":4,"title":"Two Launches, One Squad","owner":"ENABLEMENT","ownerDept":"Executive Office","accounts":["ADEPA","UNITY"],"modules":{"primary":"M11","secondary":["M1"]},"ccp":"A33","situation":"Adepa Pay's Gateway integration and Unity Trust's GhanaPay merchant rollout are both stuck. The MD has given the squad two weeks of extra capacity, about four people, and wants one plan by Monday. Both partners are calling daily.","data":[{"label":"Adepa Gateway once live","value":"Illustrative GHS 180,000 a month"},{"label":"Unity merchants once live","value":"2,000 merchants, illustrative GHS 120,000 a month"},{"label":"Adepa open items","value":"Certification, legal addendum, billing set-up"},{"label":"Unity open items","value":"Merchant document files, legal addendum, agent briefing"}],"question":"Where does the squad put its extra capacity?","options":[{"key":"A","text":"Fast-track Adepa's Gateway, since it carries the higher monthly revenue and the most senior attention at both firms.","effects":{"capital":100000,"trust":0,"risk":0,"ttl":-5},"feedback":"Adepa's certification gets four extra people. Unity's rollout waits.","route":"N4.2a","effectsIf":[{"flag":"adepa_cold","effects":{"capital":-100000,"trust":-3,"risk":0,"ttl":10},"note":"Adepa is still cool on GhIPSS and slow to respond."}]},{"key":"B","text":"Fast-track Unity's merchant rollout, since its agents are ready and every week of delay wastes that investment.","effects":{"capital":100000,"trust":0,"risk":0,"ttl":-5},"feedback":"Unity's rollout gets four extra people. Adepa's certification waits.","route":"N4.2b","effectsIf":[{"flag":"evening_fix","effects":{"capital":100000,"trust":3,"risk":0,"ttl":-5},"note":"Unity already trusts GhIPSS after the evening cash-out fix."}]},{"key":"C","text":"Map both critical paths first, then put all four people on the longest dependency, whichever launch holds it.","effects":{"capital":150000,"trust":3,"risk":0,"ttl":-10},"feedback":"The map takes half a day. It shows that the longest item in both launches is the same one, and it is not technical.","route":"N4.2c"},{"key":"D","text":"Run both launches in parallel at equal priority, and ask both teams to work weekends until each one closes.","effects":{"capital":300000,"trust":3,"risk":5,"ttl":-5},"feedback":"Both launches move a little faster for a week. Overtime claims start to climb.","route":"N4.2d","setFlags":["burnout"]}]},"N4.2a":{"id":"N4.2a","kind":"branch","round":4,"title":"Two Failed Test Cases","owner":"PLATFORM","ownerDept":"Technology (with ERC)","accounts":["ADEPA"],"modules":{"primary":"M11","secondary":["M10"]},"ccp":"A33","situation":"Adepa passes 12 of 14 Gateway certification cases. It fails two: OTP replay protection, and a debug log that stores customers' Customer Identification Values in plain text. Adepa says both are quick fixes and asks to go live on Monday as planned, with the fixes to follow.","data":[{"label":"Certification cases passed","value":"12 of 14"},{"label":"Failed","value":"OTP replay protection; CIV stored in plain-text debug logs"},{"label":"Adepa's planned go-live","value":"Monday"},{"label":"Next scheduled retest slot","value":"Day 70"}],"question":"What does Platform decide?","options":[{"key":"A","text":"Certify now with a remediation letter, since Adepa has promised both fixes within the month and the window is short.","effects":{"capital":250000,"trust":5,"risk":20,"ttl":-10},"feedback":"Adepa launches on Monday. Customer identification values are now sitting in logs on a live system.","setFlags":["cert_waived"]},{"key":"B","text":"Go live on Monday with a GHS 2,000 cap per transaction, and verify both fixes in production within 30 days.","effects":{"capital":300000,"trust":3,"risk":15,"ttl":-10},"feedback":"The cap limits the value of each transaction. It does nothing about identification values already sitting in Adepa's logs.","setFlags":["cert_waived"]},{"key":"C","text":"Hold go-live, pair a GhIPSS engineer with Adepa's developers on both fixes, and book a retest within five working days.","effects":{"capital":200000,"trust":5,"risk":-5,"ttl":-5},"feedback":"The fixes take three days with a GhIPSS engineer alongside. Adepa goes live nine days after it wanted to, and nothing sensitive is exposed.","requires":{"meter":"trust","op":">=","value":40},"lockedReason":"Locked: Partner Trust below 40. Adepa will not let a GhIPSS engineer into its code base."},{"key":"D","text":"Return the full test suite to Adepa and restart certification at the Day 70 slot, so every case is retested cleanly.","effects":{"capital":-150000,"trust":-5,"risk":-5,"ttl":15},"feedback":"Clean and slow. Adepa loses three weeks over two defects that took three days to fix."}]},"N4.2b":{"id":"N4.2b","kind":"branch","round":4,"title":"The Merchant Files","owner":"SERVICE","ownerDept":"Shared Services (document handling)","accounts":["UNITY"],"modules":{"primary":"M11","secondary":["M3"]},"ccp":"A33","situation":"Unity Trust has sent 2,000 merchant onboarding files for GhanaPay. Shared Services finds 38% incomplete, mostly missing Ghana Card numbers or business registration. Unity wants all 2,000 live by month-end for a regional launch event, with the Minister's office invited.","data":[{"label":"Complete files","value":"1,240"},{"label":"Incomplete files","value":"760"},{"label":"Usual turnaround to fix a file by post and email","value":"12 days"},{"label":"Launch event","value":"In 16 days"}],"question":"What does Shared Services do?","options":[{"key":"A","text":"Onboard all 2,000 merchants in time for the launch and collect the missing documents in the month after go-live.","effects":{"capital":350000,"trust":5,"risk":20,"ttl":-10},"feedback":"The launch event is a success. 760 merchants are live without the documents the onboarding rules require, and the gap is now on GhIPSS's books."},{"key":"B","text":"Onboard the 1,240 complete files now, and return the 760 incomplete ones to Unity with a list of what is missing.","effects":{"capital":100000,"trust":0,"risk":0,"ttl":-5},"feedback":"1,240 merchants go live. The rest follow in three weeks, after the launch event."},{"key":"C","text":"Hold every file until all 2,000 are complete, so the launch happens once and nothing has to be fixed afterwards.","effects":{"capital":-200000,"trust":-5,"risk":0,"ttl":15},"feedback":"Nobody goes live this month. Unity postpones the launch event and asks why the switch is slower than its own branches."},{"key":"D","text":"Onboard the complete files now, and run a two-day document clinic at Unity's branches for the other 760.","effects":{"capital":200000,"trust":8,"risk":0,"ttl":-10},"feedback":"Merchants bring their documents to the branch. 700 of the 760 are complete in two days and live for the launch.","effectsIf":[{"flag":"mandate_fixed","effects":{"capital":0,"trust":0,"risk":0,"ttl":-5},"note":"Shared Services has run a joint checklist with a bank before."}]}]},"N4.2c":{"id":"N4.2c","kind":"branch","round":4,"title":"The Longest Pole","owner":"CONTROL","ownerDept":"Legal","accounts":["ADEPA","UNITY"],"modules":{"primary":"M11","secondary":["M9"]},"ccp":"A33","situation":"The critical path map is on the wall. For both launches the longest item is the same: Legal's review of the participation addenda. Both sit behind 23 other contracts, and an average review takes 19 working days. Most of the clauses being negotiated are the same ones every time.","data":[{"label":"Contracts in Legal's queue","value":"25"},{"label":"Average review time","value":"19 working days"},{"label":"Clauses negotiated in 80% of addenda","value":"Liability, data protection, termination"},{"label":"Legal team","value":"3 people"}],"question":"What does Legal do?","options":[{"key":"A","text":"Fast-track both addenda by skipping the second-reviewer check, which saves about a week on each contract.","effects":{"capital":300000,"trust":0,"risk":15,"ttl":-10},"feedback":"Both addenda are signed a week early. One carries a liability clause nobody else would have accepted.","setFlags":["liability_gap"]},{"key":"B","text":"Draft a standard addendum with pre-approved fallbacks on the three usual clauses, reviewed in five days.","effects":{"capital":200000,"trust":5,"risk":0,"ttl":-20},"feedback":"The template takes four days to write. Both addenda clear in five days each, and the queue behind them starts to move.","setFlags":["template_contracts"]},{"key":"C","text":"Instruct external counsel to clear both addenda within ten days, funded from the squad's quarterly budget.","effects":{"capital":-150000,"trust":0,"risk":0,"ttl":-10},"feedback":"External counsel delivers on time and the invoice arrives. Next quarter's addenda join the same queue."},{"key":"D","text":"Let BD negotiate the addenda directly with both partners, and bring Legal in at the end for signature only.","effects":{"capital":250000,"trust":0,"risk":15,"ttl":-5},"feedback":"BD concedes on liability to close faster. Legal sees the terms for the first time at signature.","setFlags":["liability_gap"]}]},"N4.2d":{"id":"N4.2d","kind":"branch","round":4,"title":"Weekend Warriors","owner":"ENABLEMENT","ownerDept":"People and Culture","accounts":["ADEPA","UNITY"],"modules":{"primary":"M11","secondary":["M9"]},"ccp":"A33","situation":"Two weekends in, both launches are moving slowly. Overtime claims have tripled. Two of Platform's four certification engineers have handed in resignation letters, and the desk lead says her team is making mistakes after 12-hour days. Neither launch is live.","data":[{"label":"Overtime cost so far","value":"GHS 140,000"},{"label":"Certification engineers","value":"4, of whom 2 are resigning"},{"label":"Desk error rate","value":"Up from 2% to 7%"},{"label":"Launches live","value":"0 of 2"}],"question":"What does People and Culture recommend?","options":[{"key":"A","text":"Sequence the launches using the critical path, end weekend work, and backfill one engineer from a contract pool.","effects":{"capital":150000,"trust":3,"risk":0,"ttl":-10},"feedback":"With one launch at a time the work moves faster than both did together. The resignations are withdrawn after a frank conversation.","clearFlags":["burnout"]},{"key":"B","text":"Approve continued overtime and a retention bonus for the two engineers, so both launches keep their current pace.","effects":{"capital":-300000,"trust":0,"risk":5,"ttl":0},"feedback":"One engineer stays and one leaves anyway. The pace does not improve, because the plan has not changed."},{"key":"C","text":"End weekend work immediately and tell both partners that their launches will move back by four weeks.","effects":{"capital":-100000,"trust":-5,"risk":0,"ttl":10},"feedback":"The team recovers and both partners are unhappy. Rest without a new plan just moves the delay.","clearFlags":["burnout"]},{"key":"D","text":"Keep the current pace for two more weeks, then run a wellbeing session for the teams once both launches are live.","effects":{"capital":250000,"trust":0,"risk":10,"ttl":-5},"feedback":"Two more weeks of 12-hour days. Error rates keep rising and the resignations stand."}]},"N4.3":{"id":"N4.3","kind":"default","round":4,"title":"Live, But Unbilled","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["ADEPA"],"modules":{"primary":"M11","secondary":["M1"]},"ccp":"A33","situation":"Adepa's first live transactions run this week. Finance checks the billing system and finds Adepa has not been set up: the commercial terms were agreed by email and never loaded. On the usual timetable the first invoice goes out in 45 days, and Adepa's finance team is already asking how it will be billed.","data":[{"label":"Live transactions this week","value":"31,000"},{"label":"Billing set-up checklist","value":"0 of 6 items complete"},{"label":"Usual billing set-up","value":"30 days after go-live"},{"label":"Adepa's question","value":"\"When do we get our first invoice?\""}],"question":"What does Finance do?","options":[{"key":"A","text":"Load the agreed terms this week, confirm a sample invoice with Adepa, and add billing to the go-live checklist.","effects":{"capital":200000,"trust":5,"risk":-5,"ttl":0},"feedback":"Adepa confirms the sample in a day. The first invoice is right, and billing set-up now happens before go-live for every partner.","effectsIf":[{"flag":"unit_cost_known","effects":{"capital":100000,"trust":0,"risk":0,"ttl":0},"note":"The rebate tiers were already modelled from known unit costs."}]},{"key":"B","text":"Bill Adepa manually from spreadsheets for the first quarter, and load the terms into the system at the next cycle.","effects":{"capital":100000,"trust":0,"risk":5,"ttl":0},"feedback":"Invoices go out on time, built by hand. One formula error later takes a month to unpick."},{"key":"C","text":"Wait for the standard 30-day set-up after go-live, and back-bill Adepa for the missed period at quarter end.","effects":{"capital":-150000,"trust":-8,"risk":0,"ttl":0},"feedback":"Adepa's finance team receives a large, unexpected back-bill and disputes half of it."},{"key":"D","text":"Invoice Adepa at the standard tariff for now, and apply the agreed rebate later as a credit note once confirmed.","effects":{"capital":350000,"trust":-10,"risk":0,"ttl":0},"feedback":"GhIPSS books more revenue this month. Adepa's finance director calls the MD to ask why GhIPSS ignored the deal it signed."}]},"N5.1":{"id":"N5.1","kind":"default","round":5,"title":"The Capacity Case","owner":"PLATFORM","ownerDept":"Technology","accounts":["SAVANNA","ADEPA"],"modules":{"primary":"M9","secondary":["M12","M1"]},"ccp":"A28","situation":"Budget season. Platform needs GHS 2.4 million next year for GIP capacity, because month-end peaks now reach 82% of capacity. Last year the same request was cut in half after the CFO asked one question: \"What does this earn?\" The submission is due on Friday.","data":[{"label":"GIP month-end peak","value":"82% of capacity"},{"label":"Peak growth","value":"About 3 points a month"},{"label":"Request","value":"GHS 2.4 million"},{"label":"Transfers on a month-end peak day","value":"690,000"}],"question":"How does Platform frame the request?","options":[{"key":"A","text":"List the technical specifications and the vendor quote, since the CFO's team can work out the business case.","effects":{"capital":-200000,"trust":0,"risk":5,"ttl":0},"feedback":"The CFO's team cannot work it out. The request is halved again, and month-end peaks keep climbing."},{"key":"B","text":"Warn ExCo that the rail will fail at month-end within six months unless the full amount is approved now.","effects":{"capital":-100000,"trust":0,"risk":0,"ttl":0},"feedback":"ExCo hears a threat and asks why Platform did not raise it sooner. Part of the budget is approved with a lot of scepticism attached."},{"key":"C","text":"Show the revenue riding on month-end peaks, the date they hit 100%, and what each cedi of capacity protects.","effects":{"capital":350000,"trust":0,"risk":-5,"ttl":0},"feedback":"The CFO can see the revenue protected for each cedi spent and the date the risk becomes real. The request is approved in full.","effectsIf":[{"flag":"unit_cost_known","effects":{"capital":100000,"trust":0,"risk":0,"ttl":0},"note":"Platform already knows its cost per transaction."}]},{"key":"D","text":"Split the request into two phases, with the second released only once peaks pass 90% of capacity.","effects":{"capital":150000,"trust":0,"risk":3,"ttl":0},"feedback":"Phase one is approved quickly. Phase two depends on a trigger that may arrive faster than procurement can."}]},"N5.2":{"id":"N5.2","kind":"spine","round":5,"title":"The Sponsor's Question","owner":"ENABLEMENT","ownerDept":"Executive Office","accounts":["UNITY"],"modules":{"primary":"M12","secondary":["M2"]},"ccp":"A31","situation":"The sponsor joins the squad on Day 88. She wants one commitment the squad will deliver in the next 90 days, which she will review at day 30. She reads out the specificity standard: a verifiable action, a commercial link, a measure GhIPSS already collects, and a named owner who has agreed it with their manager.","data":[{"label":"Specificity standard","value":"Four criteria; all four must be met"},{"label":"Day-30 checkpoint","value":"Sponsor and line manager"},{"label":"Squad's strongest evidence this quarter","value":"Repeat tickets from Unity Trust"}],"question":"Which commitment does the squad put forward?","options":[{"key":"A","text":"We will improve our service to partners across all four accounts and report progress to the sponsor every month.","effects":{"capital":-100000,"trust":0,"risk":0,"ttl":0},"feedback":"The sponsor smiles and slides the card back across the table.","route":"N5.3b"},{"key":"B","text":"We will raise GhanaPay volumes by 30% next quarter through better support to banks, agents and their merchants.","effects":{"capital":0,"trust":0,"risk":0,"ttl":0},"feedback":"A commercial link and a real measure. The action is vague, the owner is the whole squad, and most of the volume sits outside its control.","route":"N5.3b"},{"key":"C","text":"We will run four workshops for partner banks on GhIPSS products and processes before the end of this year.","effects":{"capital":-50000,"trust":0,"risk":0,"ttl":0},"feedback":"Verifiable and easy to count. Nothing in it links to revenue.","route":"N5.3b"},{"key":"D","text":"Desk lead halves Unity Trust repeat tickets by day 60, tracked in the ticket system, agreed with her manager.","effects":{"capital":300000,"trust":5,"risk":0,"ttl":0},"feedback":"The sponsor checks each criterion and initials the card. She can verify this at day 30 without asking anyone what it means.","route":"N5.3a"}]},"N5.3a":{"id":"N5.3a","kind":"branch","round":5,"title":"Find Your Pair","owner":"SERVICE","ownerDept":"Shared Services (service desk)","accounts":["UNITY"],"modules":{"primary":"M12","secondary":["M2"]},"ccp":"A31","situation":"The sponsor accepts the commitment. To halve Unity's repeat tickets the desk needs help, because the causes sit partly in Platform's monitoring, partly in Unity's batch windows and partly in how agents are briefed. The sponsor asks the desk lead to name one function to co-own it.","data":[{"label":"Repeat tickets by cause","value":"Bank batch windows 45%, agent knowledge 35%, platform alerts 20%"},{"label":"Day-30 checkpoint","value":"One measure, one owner, one partner function"}],"question":"Which partner function does the desk choose?","options":[{"key":"A","text":"Brand and Communications, to brief agents on known outage windows, which covers over a third of repeat calls.","effects":{"capital":150000,"trust":3,"risk":0,"ttl":0},"feedback":"Agents call less and still lose trade during the windows. A good partner for the second cause."},{"key":"B","text":"Platform, to alert the desk and the bank when cash-outs fail in a batch window, the largest single cause.","effects":{"capital":300000,"trust":5,"risk":0,"ttl":0},"feedback":"Platform's alerts reach Unity before its agents do. The largest cause of repeat calls starts to fall within a fortnight."},{"key":"C","text":"Finance, to measure the revenue lost to repeat tickets each month, so the sponsor sees the full cost at day 30.","effects":{"capital":50000,"trust":0,"risk":0,"ttl":0},"feedback":"The cost is now visible every month. Visibility of the problem does not remove any of its causes."},{"key":"D","text":"Nobody yet, since a second owner would slow the desk down and blur accountability at the day-30 checkpoint.","effects":{"capital":-100000,"trust":0,"risk":0,"ttl":0},"feedback":"The desk owns a commitment whose largest cause it cannot touch. Day 30 will show it."}]},"N5.3b":{"id":"N5.3b","kind":"branch","round":5,"title":"Sent Back","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["UNITY"],"modules":{"primary":"M12","secondary":["M9"]},"ccp":"A28","situation":"The sponsor hands the commitment back. \"I cannot check this at day 30. Rewrite it so a stranger could verify it.\" The squad has five minutes before she leaves for the next room.","data":[{"label":"Criteria met by the current draft","value":"1 or 2 of 4"},{"label":"Missing","value":"A verifiable action, an existing measure or a named owner"}],"question":"Which rewrite meets the standard?","options":[{"key":"A","text":"The squad will work harder to support GhanaPay partners and will report qualitative progress at day 30.","effects":{"capital":-150000,"trust":0,"risk":0,"ttl":0},"feedback":"The sponsor leaves without initialling anything. The squad leaves without a commitment."},{"key":"B","text":"The squad will cut partner complaints significantly this quarter, measured by a new partner survey we design.","effects":{"capital":0,"trust":0,"risk":0,"ttl":0},"feedback":"Closer. A measure that does not exist yet cannot be checked at day 30, and \"significantly\" cannot be verified."},{"key":"C","text":"Each function will set its own target, and the squad will consolidate them into a plan after the sponsor leaves.","effects":{"capital":-200000,"trust":-3,"risk":0,"ttl":0},"feedback":"The sponsor leaves with nothing to review, and the plan stays a promise to write a plan."},{"key":"D","text":"Desk lead halves repeat tickets from Unity Trust by day 60, tracked in the ticket system, agreed with her manager.","effects":{"capital":200000,"trust":3,"risk":0,"ttl":0},"feedback":"All four criteria met. The sponsor initials the card on her way out."}]},"E_ADEPA_DETOUR":{"id":"E_ADEPA_DETOUR","kind":"echo","title":"The Detour","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["ADEPA"],"trigger":{"all":["adepa_cold"]},"eligibleRounds":[2,3,4],"priority":55,"modules":{"primary":"M3","secondary":["M1"]},"ccp":"A28","situation":"Adepa Pay has launched its wallet on a direct mobile money integration and says GIP \"can wait until next year\". Its merchants are asking for GhQR anyway, because their customers expect it. Adepa's CFO calls Finance to ask what GhIPSS \"can do on price\".","data":[{"label":"Adepa merchants asking for GhQR","value":"340 of 1,200"},{"label":"Adepa transactions on the direct route","value":"90,000 a month"},{"label":"GhIPSS revenue from those transactions","value":"GHS 0"}],"question":"What does Finance offer?","options":[{"key":"A","text":"Offer the full six-month waiver Adepa first asked for, to win the relationship back before the year closes.","effects":{"capital":-200000,"trust":8,"risk":0,"ttl":-5},"feedback":"Adepa comes back on the terms it wanted in the first place. Every fintech in the queue has just learned that walking away pays.","setFlags":["waiver_precedent"],"clearFlags":["adepa_cold"]},{"key":"B","text":"Offer the published rebate with its fee floor, tied to a GIP go-live date and GhQR at all 1,200 merchants.","effects":{"capital":350000,"trust":8,"risk":0,"ttl":-10},"feedback":"Adepa gets a reason to come back that every other fintech can see and match. The direct route stays, and GIP becomes the main rail.","setFlags":["tiered_rebate"],"clearFlags":["adepa_cold"]},{"key":"C","text":"Hold the original position, because reopening price now would teach every partner that walking away pays off.","effects":{"capital":-250000,"trust":-5,"risk":0,"ttl":10},"feedback":"Principled, and the 90,000 monthly transactions stay on a route that pays GhIPSS nothing."},{"key":"D","text":"Offer GhQR onboarding support for Adepa's merchants first, and leave GIP pricing to next year's review.","effects":{"capital":100000,"trust":3,"risk":0,"ttl":0},"feedback":"GhQR volume starts to flow. The larger GIP prize waits another year."}],"autoResolve":{"effects":{"capital":-350000,"trust":-3,"risk":0,"ttl":0},"note":"Adepa's volume stays on the direct route for the rest of the quarter."}},"E_MANDATE":{"id":"E_MANDATE","kind":"echo","title":"The Biller Walks","owner":"SERVICE","ownerDept":"Shared Services (document handling)","accounts":["AKWAABA"],"trigger":{"all":["mandate_backlog"]},"eligibleRounds":[2,3],"priority":50,"modules":{"primary":"M9","secondary":["M4"]},"ccp":"A28","situation":"Akwaaba Insurance has written to Meridian Bank: from next month it will move 60% of its premium collections to a mobile money biller, because \"direct debits fail a third of the time\". Meridian forwards the letter to GhIPSS with one word: \"Help.\" The mandate backlog still stands at 1,900.","data":[{"label":"Akwaaba monthly direct debits","value":"18,000"},{"label":"Share leaving","value":"60%, about 10,800 items a month"},{"label":"Other insurers on ACH direct debit","value":"7"}],"question":"What does Shared Services do now?","options":[{"key":"A","text":"Clear the backlog and propose a joint e-mandate pilot with Meridian and Akwaaba so mandates arrive complete.","effects":{"capital":250000,"trust":8,"risk":0,"ttl":0},"feedback":"Akwaaba keeps its collections on ACH for the pilot. Meridian now has a story for the other seven insurers.","setFlags":["mandate_fixed"],"clearFlags":["mandate_backlog"]},{"key":"B","text":"Clear the remaining backlog this week with temporary staff, and write to Akwaaba confirming the date it was cleared.","effects":{"capital":100000,"trust":3,"risk":0,"ttl":0},"feedback":"The backlog clears and Akwaaba delays its decision by a month. The incomplete mandates keep arriving.","clearFlags":["mandate_backlog"]},{"key":"C","text":"Accept the loss, since Akwaaba's choice of collection channel is a matter between Meridian Bank and its client.","effects":{"capital":-400000,"trust":-8,"risk":0,"ttl":0},"feedback":"Akwaaba moves. Two of the other seven insurers ask Meridian whether they should do the same."},{"key":"D","text":"Offer Meridian a 50% fee discount on Akwaaba's direct debits for a year if the collections stay on ACH.","effects":{"capital":-200000,"trust":3,"risk":0,"ttl":0},"feedback":"Meridian accepts the discount. Debits still fail a third of the time, so Akwaaba's problem is unchanged."}],"autoResolve":{"effects":{"capital":-400000,"trust":-5,"risk":0,"ttl":0},"note":"Akwaaba moves 60% of collections off the ACH rail."}},"E_SIGNAL_MISSED":{"id":"E_SIGNAL_MISSED","kind":"echo","title":"Unity Looks Elsewhere","owner":"SERVICE","ownerDept":"Shared Services (service desk)","accounts":["UNITY"],"trigger":{"all":["signal_missed"]},"eligibleRounds":[4,5],"priority":60,"modules":{"primary":"M4","secondary":["M10","M3"]},"ccp":"A31","situation":"Unity Trust Bank's head of digital tells GhIPSS it is \"reviewing options\" for its agent network, including a white-label wallet from a private provider. Her reason: \"Our agents lose evening trade and nobody at GhIPSS seems to notice.\" The evening cash-out failures have now run for ten weeks.","data":[{"label":"Unity GhanaPay volume since Day 1","value":"Down 31%"},{"label":"Evening failure tickets, all closed","value":"58"},{"label":"Unity's share of GhanaPay agents","value":"9%"}],"question":"What does the desk do?","options":[{"key":"A","text":"Offer Unity a fee discount on GhanaPay transactions for six months while it completes its review of the options.","effects":{"capital":-250000,"trust":3,"risk":0,"ttl":0},"feedback":"Unity takes the discount and keeps reviewing. A cheaper failure is still a failure."},{"key":"B","text":"Send Unity the desk's service report showing that 96% of its tickets were closed within the 24-hour target.","effects":{"capital":-200000,"trust":-10,"risk":0,"ttl":0},"feedback":"Unity's head of digital forwards the report to her CEO with one line: \"This is the problem.\""},{"key":"C","text":"Reopen the tickets as one case, trace the failures with Platform this week, and give Unity a dated fix plan.","effects":{"capital":200000,"trust":8,"risk":0,"ttl":0},"feedback":"The trace finds Unity's 18:00 batch window within a day. Unity pauses its review to see whether the fix holds.","setFlags":["evening_fix"],"clearFlags":["signal_missed"]},{"key":"D","text":"Ask BD to arrange a senior meeting with Unity to understand its concerns before GhIPSS commits to anything.","effects":{"capital":0,"trust":2,"risk":0,"ttl":0},"feedback":"The meeting is cordial. Unity explains what the tickets already said."}],"autoResolve":{"effects":{"capital":-500000,"trust":-5,"risk":0,"ttl":0},"note":"Unity moves part of its agent network to a private wallet."}},"E_GHLINK_CLAIM":{"id":"E_GHLINK_CLAIM","kind":"echo","title":"Declined in Dubai","owner":"ENABLEMENT","ownerDept":"Brand and Communications","accounts":["SAVANNA"],"trigger":{"all":["ghlink_claim"]},"eligibleRounds":[4,5],"priority":70,"modules":{"primary":"M3","secondary":["M10"]},"ccp":"A31","situation":"Savanna's campaign ran. Complaints are arriving from cardholders whose gh-link cards were declined in Dubai, Lome and London. One has posted a photo of the billboard next to her declined receipt. Savanna's call centre is telling customers to \"ask GhIPSS\", and a consumer protection query has reached Savanna's compliance team.","data":[{"label":"Complaints in two weeks","value":"640"},{"label":"Savanna call centre wait time","value":"22 minutes"},{"label":"Views of the social post","value":"210,000"},{"label":"Billboards still up","value":"40"}],"question":"What does Brand and Communications do?","options":[{"key":"A","text":"State publicly that the headline was Savanna's, and that GhIPSS never promised gh-link acceptance outside Ghana.","effects":{"capital":-200000,"trust":-10,"risk":0,"ttl":0},"feedback":"True, and it reads as GhIPSS blaming its own participant in public. Savanna's CEO calls the MD.","clearFlags":["ghlink_claim"]},{"key":"B","text":"Leave the billboards to run out their contract, and handle complaints one by one through Savanna's call centre.","effects":{"capital":-250000,"trust":0,"risk":10,"ttl":0},"feedback":"The billboards stay up for six more weeks. So does the complaint count."},{"key":"C","text":"Agree a joint correction with Savanna, replace the headline, and give its call centre a true script in 48 hours.","effects":{"capital":150000,"trust":5,"risk":-15,"ttl":0},"feedback":"The correction is short and factual. Complaints fall within a week, and Savanna keeps the domestic message that works.","clearFlags":["ghlink_claim"]},{"key":"D","text":"Ask Savanna to pull the billboards immediately and to issue its own apology to the affected cardholders.","effects":{"capital":-50000,"trust":-3,"risk":-10,"ttl":0},"feedback":"The billboards come down. Savanna apologises alone and notices that GhIPSS stood back.","clearFlags":["ghlink_claim"]}],"autoResolve":{"effects":{"capital":-450000,"trust":0,"risk":10,"ttl":0},"note":"Complaints and a consumer protection review land on the scheme."}},"E_UNAPPROVED_CHANGE":{"id":"E_UNAPPROVED_CHANGE","kind":"echo","title":"The Timeout Returns","owner":"PLATFORM","ownerDept":"Technology","accounts":["SAVANNA","AKWAABA"],"trigger":{"all":["unapproved_change"]},"eligibleRounds":[4,5],"priority":80,"modules":{"primary":"M10","secondary":["M2"]},"ccp":"A31","situation":"On the last day of the month, salary volumes hit GIP. The longer timeout Platform set on Meridian's route during the incident, never reviewed by change control, now holds connections open far longer than designed. Queues build across the rail and response times triple for every bank.","data":[{"label":"GIP volume today","value":"690,000 transfers"},{"label":"Average response time","value":"Up from 1.2 to 3.9 seconds"},{"label":"Change record for the timeout change","value":"None"},{"label":"Banks affected","value":"All"}],"question":"What does Platform do?","options":[{"key":"A","text":"Quietly reset the timeout to its old value tonight, and record the change as routine overnight maintenance.","effects":{"capital":150000,"trust":0,"risk":15,"ttl":0},"feedback":"The queues clear tonight. Internal Audit finds the mismatch between the logs and the change record three months later.","clearFlags":["unapproved_change"]},{"key":"B","text":"Add capacity to absorb the queues for month-end, and review the timeout setting after the salary run finishes.","effects":{"capital":-250000,"trust":0,"risk":5,"ttl":0},"feedback":"Expensive capacity treats the symptom. Salaries are late at two banks while the cause stays in production."},{"key":"C","text":"Escalate to the MD that a production change made during the incident is the likely cause, and await direction.","effects":{"capital":-100000,"trust":0,"risk":-5,"ttl":0},"feedback":"Honest and slower than needed. The MD tells Platform to roll it back, an hour later.","clearFlags":["unapproved_change"]},{"key":"D","text":"Roll the timeout back through emergency change control and tell the bridge exactly what was changed and why.","effects":{"capital":50000,"trust":3,"risk":-15,"ttl":0},"feedback":"Response times recover within 20 minutes. The incident review records a lesson and nobody is surprised later.","clearFlags":["unapproved_change"]}],"autoResolve":{"effects":{"capital":-600000,"trust":-5,"risk":10,"ttl":0},"note":"Month-end slowdown recurs and salaries are delayed at several banks."}},"E_SILENT_INCIDENT":{"id":"E_SILENT_INCIDENT","kind":"echo","title":"The Story Writes Itself","owner":"ENABLEMENT","ownerDept":"Brand and Communications","accounts":["SAVANNA"],"trigger":{"all":["silent_incident"]},"eligibleRounds":[4,5],"priority":75,"modules":{"primary":"M10","secondary":["M3"]},"ccp":"A31","situation":"A national business paper runs a feature: \"Is Ghana's payment switch fit for purpose?\" It quotes customers from the Meridian outage and says GhIPSS \"refused to comment\". Two banks' marketing teams have asked whether they should keep promoting GIP transfers.","data":[{"label":"Shares of the article in a day","value":"9,000"},{"label":"Banks asking about GIP promotion","value":"2"},{"label":"GhIPSS public statements during the incident","value":"0"}],"question":"What does Brand and Communications do now?","options":[{"key":"A","text":"Issue a strongly worded rebuttal pointing out the outage started at a participant bank and was fixed in hours.","effects":{"capital":-200000,"trust":-8,"risk":0,"ttl":0},"feedback":"The rebuttal becomes the second story. Meridian is now named, by GhIPSS.","clearFlags":["silent_incident"]},{"key":"B","text":"Publish the incident timeline and what changed afterwards, with a named contact, and brief the two banks first.","effects":{"capital":200000,"trust":8,"risk":0,"ttl":0},"feedback":"The paper runs a follow-up quoting the timeline. Both banks keep promoting GIP.","clearFlags":["silent_incident"]},{"key":"C","text":"Let the story fade on its own, since a public response would keep the outage in the news for another week.","effects":{"capital":-250000,"trust":-5,"risk":0,"ttl":0},"feedback":"It fades slowly. One of the two banks pauses its GIP promotion for the quarter."},{"key":"D","text":"Offer the editor an interview with the MD next week, focused on GhIPSS's investment in resilience and uptime.","effects":{"capital":50000,"trust":3,"risk":0,"ttl":0},"feedback":"A useful interview, a week late. The banks decided in the meantime.","clearFlags":["silent_incident"]}],"autoResolve":{"effects":{"capital":-400000,"trust":-8,"risk":0,"ttl":0},"note":"Banks scale back GIP promotion after negative coverage."}},"E_WAIVER_PRECEDENT":{"id":"E_WAIVER_PRECEDENT","kind":"echo","title":"Everyone Wants the Waiver","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["ADEPA"],"trigger":{"all":["waiver_precedent"]},"eligibleRounds":[4,5],"priority":72,"modules":{"primary":"M1","secondary":["M9"]},"ccp":"A28","situation":"Three fintechs negotiating to join GIP have each asked for \"the Adepa terms\": six months fee-free. One has copied the GhIPSS MD and the Bank of Ghana's fintech office. Finance has no published policy on launch pricing.","data":[{"label":"Fintechs asking","value":"3"},{"label":"Their combined six-month forecast","value":"2.8 million transactions"},{"label":"Waiver value at GHS 0.75","value":"About GHS 2.1 million"},{"label":"Published launch pricing policy","value":"None"}],"question":"What does Finance do?","options":[{"key":"A","text":"Publish a launch pricing policy for all new joiners, with stepped rebates and a fee floor, Adepa included.","effects":{"capital":300000,"trust":3,"risk":-5,"ttl":0},"feedback":"The policy turns a precedent into a rule everyone can see. Two of the three fintechs sign on the published terms within a month.","clearFlags":["waiver_precedent"],"effectsIf":[{"flag":"cost_visible","effects":{"capital":150000,"trust":0,"risk":0,"ttl":0},"note":"Finance already has the cost to serve on file and sets the floor in a day."}]},{"key":"B","text":"Grant all three the same waiver, since refusing would look unfair to participants on a national rail.","effects":{"capital":-700000,"trust":5,"risk":0,"ttl":-5},"feedback":"Consistent and very expensive. GhIPSS has now priced its newest rail at zero for every new joiner."},{"key":"C","text":"Refuse all three, and explain that Adepa's waiver was a one-off agreed at the MD's own discretion.","effects":{"capital":-300000,"trust":-10,"risk":10,"ttl":0},"feedback":"The copy to the regulator now looks justified. The fintechs read discretion as favouritism.","clearFlags":["waiver_precedent"]},{"key":"D","text":"Negotiate each request on its own merits, using each fintech's volume forecast to decide its terms.","effects":{"capital":0,"trust":-3,"risk":5,"ttl":0},"feedback":"Three separate negotiations, three different answers, and the same question again next quarter."}],"autoResolve":{"effects":{"capital":-800000,"trust":0,"risk":0,"ttl":0},"note":"New joiners negotiate down to waiver terms one by one."}},"E_CERT_BREACH":{"id":"E_CERT_BREACH","kind":"echo","title":"The Log File","owner":"PLATFORM","ownerDept":"Technology (with ERC)","accounts":["ADEPA"],"trigger":{"all":["cert_waived"]},"eligibleRounds":[5],"priority":82,"modules":{"primary":"M11","secondary":["M10"]},"ccp":"A33","situation":"A security researcher emails GhIPSS: an Adepa Pay debug log containing customer identification values was exposed on a misconfigured server. Adepa says it is investigating. The certification record shows GhIPSS approved go-live with this defect still open.","data":[{"label":"Records exposed","value":"About 18,000"},{"label":"GhIPSS certification note","value":"\"Remediation pending\""},{"label":"Regulatory incident reporting","value":"Clock has started"}],"question":"What does Platform do?","options":[{"key":"A","text":"Suspend Adepa's Gateway access, report it within the window, and force CIV resets with the issuing banks.","effects":{"capital":-200000,"trust":3,"risk":-20,"ttl":0},"feedback":"Painful and contained. The regulator sees GhIPSS acting first, and the issuing banks reset the exposed values within 48 hours.","clearFlags":["cert_waived"]},{"key":"B","text":"Leave reporting to Adepa, since the exposed server and the log file both sit inside Adepa's own environment.","effects":{"capital":-300000,"trust":-5,"risk":20,"ttl":0},"feedback":"Adepa reports late. The regulator asks why GhIPSS certified a defect it knew about and then stayed silent."},{"key":"C","text":"Keep Adepa live to protect its volume, and agree a quiet fix plan with Adepa before anything is reported.","effects":{"capital":100000,"trust":0,"risk":25,"ttl":0},"feedback":"Volume holds for now. Exposed identification values are still valid, and so is the reporting obligation."},{"key":"D","text":"Ask Adepa for a full forensic report within a week before GhIPSS decides on suspension or reporting.","effects":{"capital":-150000,"trust":0,"risk":10,"ttl":0},"feedback":"Careful and late. A week is a long time for exposed data on a live system."}],"autoResolve":{"effects":{"capital":-900000,"trust":-5,"risk":20,"ttl":0},"note":"The exposure surfaces through the regulator after the quarter."}},"E_BURNOUT":{"id":"E_BURNOUT","kind":"echo","title":"The Exit Interviews","owner":"ENABLEMENT","ownerDept":"People and Culture","accounts":["ADEPA","UNITY"],"trigger":{"all":["burnout"]},"eligibleRounds":[5],"priority":65,"modules":{"primary":"M11","secondary":["M9"]},"ccp":"A33","situation":"The two certification engineers have left. Their exit interviews say the same thing: \"Weekends became normal and nobody decided otherwise.\" Four fintechs are waiting for certification slots, and the queue has grown from 15 to 35 working days.","data":[{"label":"Certification engineers remaining","value":"2"},{"label":"Certification queue","value":"35 working days, up from 15"},{"label":"Fintechs waiting","value":"4"}],"question":"What does People and Culture recommend?","options":[{"key":"A","text":"Hire two replacements at market rate and offer a sign-on bonus to fill both roles within six weeks.","effects":{"capital":-250000,"trust":0,"risk":0,"ttl":5},"feedback":"The roles fill in eight weeks. The queue keeps growing until then."},{"key":"B","text":"Ask the remaining engineers to cover the queue until replacements arrive, with overtime approved.","effects":{"capital":-200000,"trust":0,"risk":10,"ttl":10},"feedback":"Two engineers now carry the work of four. The pattern that caused the exits repeats."},{"key":"C","text":"Publish a certification capacity plan, cap overtime, and cross-train two operations engineers.","effects":{"capital":200000,"trust":3,"risk":0,"ttl":-10},"feedback":"Fintechs can see when their slot is coming, and two cross-trained engineers cut the queue to 20 days within a month.","clearFlags":["burnout"]},{"key":"D","text":"Outsource certification testing to a specialist vendor for the next quarter to clear the queue quickly.","effects":{"capital":100000,"trust":0,"risk":10,"ttl":-5},"feedback":"The queue shrinks. The vendor does not know GhIPSS's rulebook and two certifications have to be redone."}],"autoResolve":{"effects":{"capital":-400000,"trust":0,"risk":0,"ttl":15},"note":"Certification capacity stays short into next quarter."}},"E_EVENING_WIN":{"id":"E_EVENING_WIN","kind":"echo_positive","title":"Three More Banks","owner":"PLATFORM","ownerDept":"Technology","accounts":["UNITY"],"trigger":{"all":["evening_fix"]},"eligibleRounds":[4,5],"priority":40,"modules":{"primary":"M4","secondary":["M3"]},"ccp":"A31","situation":"Unity Trust's evening cash-outs are up 40% since its batch moved. Three rural banks have heard and are asking GhIPSS for \"the Unity fix\". Each runs a different core banking vendor. Platform has no spare engineers this month.","data":[{"label":"Unity evening cash-outs","value":"Up 40%"},{"label":"Banks asking for the fix","value":"3"},{"label":"Engineers available","value":"0 this month, 2 next month"}],"question":"How does Platform respond?","options":[{"key":"A","text":"Assign the next two free engineers to replicate the Unity fix bank by bank, in the order the banks asked.","effects":{"capital":150000,"trust":3,"risk":0,"ttl":5},"feedback":"Three custom projects. The first bank is fixed in six weeks and the third in four months."},{"key":"B","text":"Tell the banks that batch windows are their own business, and that the Unity case was a one-off favour.","effects":{"capital":-150000,"trust":-8,"risk":0,"ttl":0},"feedback":"The banks keep their batch windows, and their agents keep losing evening trade on a GhIPSS product."},{"key":"C","text":"Hand the requests to BD to package as a paid advisory service for any bank with an evening batch window.","effects":{"capital":100000,"trust":-3,"risk":0,"ttl":0},"feedback":"A small fee stream starts, and the banks wonder why the fix for a GhIPSS product now has a price."},{"key":"D","text":"Write the fix up as a short readiness guide and run one session for all three banks and their core vendors.","effects":{"capital":350000,"trust":8,"risk":0,"ttl":0},"feedback":"Two of the three banks move their batch windows within a month without a GhIPSS engineer on site."}],"autoResolve":{"effects":{"capital":200000,"trust":0,"risk":0,"ttl":0},"note":"Word of the Unity fix spreads and evening volume rises slowly."}},"E_TEMPLATE_DIVIDEND":{"id":"E_TEMPLATE_DIVIDEND","kind":"echo_positive","title":"Five in the Pipeline","owner":"CONTROL","ownerDept":"Legal","accounts":["ADEPA"],"trigger":{"all":["template_contracts"]},"eligibleRounds":[5],"priority":45,"modules":{"primary":"M11","secondary":["M1"]},"ccp":"A33","situation":"BD has five fintechs ready to sign. With the standard addendum, Legal can turn each around in five days. BD asks Legal to \"just sign them all this week\" to hit the quarter.","data":[{"label":"Fintechs ready to sign","value":"5"},{"label":"Template review time","value":"5 working days each"},{"label":"Addenda with non-standard clauses","value":"2 of 5"}],"question":"What does Legal do?","options":[{"key":"A","text":"Sign all five this week as BD asks, and review any non-standard clauses after the quarter closes.","effects":{"capital":450000,"trust":0,"risk":15,"ttl":-10},"feedback":"Five signatures in a week. Two contracts carry clauses Legal would never have accepted."},{"key":"B","text":"Run all five through the template, and escalate only the clauses that fall outside the pre-approved positions.","effects":{"capital":350000,"trust":3,"risk":0,"ttl":-10},"feedback":"Three sign this week and two the next, each with its exceptions reviewed. The template paid for itself in one quarter."},{"key":"C","text":"Process two contracts this quarter and three next, to keep the review queue stable for other contracts.","effects":{"capital":150000,"trust":0,"risk":0,"ttl":0},"feedback":"Stable and cautious. Three fintechs wait a quarter for a process that would have taken five days."},{"key":"D","text":"Review the template itself again before using it, since it has only been used on two deals so far.","effects":{"capital":-100000,"trust":-3,"risk":0,"ttl":5},"feedback":"The template goes back into the queue it was built to clear."}],"autoResolve":{"effects":{"capital":250000,"trust":0,"risk":0,"ttl":0},"note":"The template speeds up contracts even without a decision."}},"CB_REGULATOR":{"id":"CB_REGULATOR","kind":"curveball","title":"The Regulator Writes","owner":"CONTROL","ownerDept":"Enterprise Risk and Compliance","accounts":[],"trigger":{"all":["cb_regulator"]},"eligibleRounds":[2,3,4,5],"priority":100,"modules":{"primary":"M10","secondary":["M2"]},"ccp":"A31","situation":"The Bank of Ghana's payment systems supervisors have written to the MD. They have seen a pattern of incidents and complaints involving GhIPSS services this quarter and request a full report within ten working days, covering root causes, controls and partner impact.","data":[{"label":"Risk Exposure","value":"60 or above"},{"label":"Time to report","value":"10 working days"},{"label":"Next board meeting","value":"In 3 weeks"}],"question":"How does the squad respond?","options":[{"key":"A","text":"Send a short report covering the incident itself, and leave the open control findings out until they are fixed.","effects":{"capital":0,"trust":-3,"risk":10,"ttl":0},"feedback":"The supervisors find the open findings in their own data and ask why they were missing."},{"key":"B","text":"Ask for a 30-day extension so that the report can include completed fixes, and brief the board first.","effects":{"capital":-50000,"trust":0,"risk":-5,"ttl":0},"feedback":"The extension is granted for 15 days. The report is better and the relationship is cooler."},{"key":"C","text":"Hire an external firm to write the report and defend GhIPSS's position, whatever the internal findings show.","effects":{"capital":-400000,"trust":-5,"risk":-5,"ttl":0},"feedback":"A polished defence that the supervisors read as one. They schedule an on-site review."},{"key":"D","text":"Send a full, candid report with root causes, owners and dated fixes, and offer a walkthrough before the deadline.","effects":{"capital":-100000,"trust":5,"risk":-20,"ttl":0},"feedback":"The supervisors note the candour and the dates, and settle for a quarterly check-in."}],"autoResolve":{"effects":{"capital":-500000,"trust":0,"risk":0,"ttl":0},"note":"Supervisory review and remediation directive."}},"CB_PARTNER":{"id":"CB_PARTNER","kind":"curveball","title":"Two CEOs Ask for a Meeting","owner":"ENABLEMENT","ownerDept":"Executive Office","accounts":[],"trigger":{"all":["cb_partner"]},"eligibleRounds":[2,3,4,5],"priority":90,"modules":{"primary":"M2","secondary":["M3"]},"ccp":"A31","situation":"The CEOs of two participant banks have asked to meet the GhIPSS MD. Their letter lists slow responses, unclear ownership and \"surprises\". One mentions a bilateral arrangement with another bank \"for some flows\". The MD wants the squad's recommendation before Thursday.","data":[{"label":"Partner Trust","value":"Below 35"},{"label":"The two banks' share of GIP volume","value":"21%"},{"label":"Meeting","value":"Thursday"}],"question":"What does the squad recommend?","options":[{"key":"A","text":"Prepare a written apology from the MD, with a list of the fixes already made and those still pending.","effects":{"capital":0,"trust":8,"risk":0,"ttl":0},"feedback":"The apology is received well. The banks want to know who owns what next."},{"key":"B","text":"Bring named owners from each function to the meeting, with three dated commitments and a monthly service review.","effects":{"capital":200000,"trust":15,"risk":0,"ttl":0},"feedback":"The CEOs meet the people who will fix things. The bilateral arrangement is put on hold."},{"key":"C","text":"Offer both banks a temporary fee reduction to keep their volumes on GhIPSS rails while issues are fixed.","effects":{"capital":-400000,"trust":5,"risk":0,"ttl":0},"feedback":"The banks take the discount and keep the bilateral option open. Price was not the complaint."},{"key":"D","text":"Ask Legal to remind both banks of their obligations under the participation rules before the meeting.","effects":{"capital":-100000,"trust":-10,"risk":0,"ttl":0},"feedback":"The meeting opens cold. The banks bring their own lawyers to the next one."}],"autoResolve":{"effects":{"capital":-500000,"trust":-5,"risk":0,"ttl":0},"note":"Two banks move some flows to bilateral arrangements."}},"CB_EXCO":{"id":"CB_EXCO","kind":"curveball","title":"ExCo Review","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":[],"trigger":{"all":["cb_exco"]},"eligibleRounds":[2,3,4,5],"priority":85,"modules":{"primary":"M9","secondary":["M1"]},"ccp":"A28","situation":"The squad's quarter has slipped below plan and ExCo has called a review. The CFO wants a recovery plan on one page that shows where the next GHS 1 million will come from.","data":[{"label":"Capital","value":"Below GHS 9.0 million, the quarter plan"},{"label":"Review","value":"Tomorrow, 30 minutes"}],"question":"What does the squad bring to ExCo?","options":[{"key":"A","text":"Pick the two accounts with most revenue at risk and commit named owners to dated fixes for each.","effects":{"capital":300000,"trust":5,"risk":0,"ttl":0},"feedback":"ExCo sees focus and owners. The review closes in 20 minutes with support for both fixes."},{"key":"B","text":"Freeze all discretionary spending across the squad's functions until capital recovers to the plan.","effects":{"capital":100000,"trust":-8,"risk":0,"ttl":15},"feedback":"Costs fall and so does every activity that was earning. Two launches stall for lack of small spend."},{"key":"C","text":"Present a detailed account of the quarter's external pressures and ask ExCo for revised targets.","effects":{"capital":-100000,"trust":0,"risk":0,"ttl":0},"feedback":"ExCo hears reasons and no plan. The review is rescheduled for next week."},{"key":"D","text":"Ask each function for one saving and one revenue action, and consolidate them into a plan by Friday.","effects":{"capital":150000,"trust":2,"risk":0,"ttl":0},"feedback":"A reasonable plan arrives on Friday, spread thinly across everything."}],"autoResolve":{"effects":{"capital":0,"trust":0,"risk":0,"ttl":0},"note":"No additional cost; the review happens after the quarter."}}},"injects":{"I1":{"id":"I1","kind":"inject","title":"Month-End Collision","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["ADEPA"],"modules":{"primary":"M11","secondary":["M9"]},"ccp":"A33","situation":"Finance's month-end close starts tomorrow. The same two analysts are needed to confirm settlement figures for a partner's go-live reconciliation, and the partner's go-live slot cannot move without a two-week delay.","data":[{"label":"Analysts available","value":"2"},{"label":"Month-end close","value":"3 working days"},{"label":"Cost of moving the go-live","value":"2 weeks of delay"}],"question":"What does Finance do?","options":[{"key":"A","text":"Put both analysts on the close, and move the partner's go-live back by two weeks to protect reporting.","effects":{"capital":-100000,"trust":-5,"risk":0,"ttl":10},"feedback":"Reporting is safe. The partner loses two weeks and asks why GhIPSS scheduled a go-live on top of month-end."},{"key":"B","text":"Put both analysts on the go-live, and tell the CFO that the close will be three days late this month.","effects":{"capital":300000,"trust":3,"risk":10,"ttl":-5},"feedback":"The go-live lands. Late reporting draws questions from the board and the auditors."},{"key":"C","text":"Split the pair: one runs the close, the other supports go-live using a pre-agreed reconciliation template.","effects":{"capital":200000,"trust":5,"risk":0,"ttl":-5},"feedback":"Both happen. The template does most of the go-live work, and the close finishes a few hours late."},{"key":"D","text":"Ask the partner to reconcile its own settlement figures for go-live, and confirm them after the close is done.","effects":{"capital":-150000,"trust":-8,"risk":5,"ttl":0},"feedback":"The partner's figures do not match GhIPSS's. Go-live is delayed anyway, and the relationship takes the hit."}]},"I2":{"id":"I2","kind":"inject","title":"The Journalist Calls","owner":"ENABLEMENT","ownerDept":"Brand and Communications","accounts":[],"modules":{"primary":"M10","secondary":["M3"]},"ccp":"A31","situation":"A journalist calls asking whether GhIPSS's systems were hacked last week. They were not. A planned maintenance window ran 40 minutes over, and some customers saw failed transfers at 2am. The story runs tomorrow either way.","data":[{"label":"Maintenance overrun","value":"40 minutes"},{"label":"Failed transfers during the overrun","value":"About 1,800"},{"label":"Story deadline","value":"18:00 today"}],"question":"What does Brand and Communications say?","options":[{"key":"A","text":"Decline to comment, since any statement now could be taken out of context and make the story even larger.","effects":{"capital":-200000,"trust":-5,"risk":5,"ttl":0},"feedback":"The headline asks whether GhIPSS was hacked, and nobody from GhIPSS answers it."},{"key":"B","text":"Say the overrun was caused by a vendor's software, so readers know the fault does not sit with GhIPSS itself.","effects":{"capital":-50000,"trust":-3,"risk":0,"ttl":0},"feedback":"The vendor's lawyers call before lunch. The story now has a second chapter."},{"key":"C","text":"Confirm the facts on record: a planned maintenance overrun of 40 minutes, no breach, and what changes next.","effects":{"capital":150000,"trust":5,"risk":-5,"ttl":0},"feedback":"The story runs as a maintenance overrun with GhIPSS's explanation in it. It is gone by the weekend."},{"key":"D","text":"Refer the journalist to the Bank of Ghana, which oversees the payment system and can speak for it.","effects":{"capital":-50000,"trust":0,"risk":0,"ttl":0},"feedback":"The regulator's office refers the journalist back to GhIPSS, a day later."}]},"I3":{"id":"I3","kind":"inject","title":"Generator Day","owner":"PLATFORM","ownerDept":"Technology","accounts":[],"modules":{"primary":"M10","secondary":["M9"]},"ccp":"A31","situation":"A grid outage has put the primary data centre on generator power. There is fuel for about six hours and a resupply truck is uncertain. The disaster recovery site was last tested four months ago. It is 11:00 on a weekday and GIP is carrying 9,000 transfers a minute.","data":[{"label":"Generator fuel","value":"About 6 hours"},{"label":"Last DR test","value":"4 months ago"},{"label":"GIP load","value":"9,000 transfers a minute"}],"question":"What does Platform do?","options":[{"key":"A","text":"Switch to the DR site now, while the primary site is still stable and the risk of a hard failure is low.","effects":{"capital":-100000,"trust":-3,"risk":5,"ttl":0},"feedback":"The switchover works with a 12-minute interruption at peak, which the grid outage alone would never have caused."},{"key":"B","text":"Wait for the grid to return and act only if fuel runs low, since a switchover carries risks of its own.","effects":{"capital":-250000,"trust":-5,"risk":15,"ttl":0},"feedback":"Fuel runs short at 16:40 and the switchover happens under pressure at the worst possible time."},{"key":"C","text":"Order emergency fuel, monitor the generator closely, and keep the banks out of it unless something fails.","effects":{"capital":50000,"trust":-3,"risk":5,"ttl":0},"feedback":"The fuel arrives and all is well. Two banks hear about the outage from the news and ask why GhIPSS did not tell them."},{"key":"D","text":"Tell the banks, order fuel, prepare DR, and fix a time to switch over if the grid is still down by then.","effects":{"capital":200000,"trust":5,"risk":-10,"ttl":0},"feedback":"The grid returns after four hours. Banks were told what would happen and when, and nothing was switched in a panic."}]},"I4":{"id":"I4","kind":"inject","title":"The Data Request","owner":"CONTROL","ownerDept":"Legal (with ERC)","accounts":["ADEPA"],"modules":{"primary":"M3","secondary":["M9"]},"ccp":"A28","situation":"A fintech asks for GhQR merchant transaction data by location so it can target its marketing. It offers to pay GHS 250,000. The data would include merchant names, locations and daily takings.","data":[{"label":"Offer","value":"GHS 250,000"},{"label":"Data requested","value":"Merchant names, locations, daily takings"},{"label":"Applicable law","value":"Data Protection Act, 2012 (Act 843)"}],"question":"What does Legal advise?","options":[{"key":"A","text":"Sell the data as requested, since the fintech is a licensed participant and the fee is new revenue for GhIPSS.","effects":{"capital":250000,"trust":-10,"risk":25,"ttl":0},"feedback":"The fee arrives. So does a complaint from a merchant association that recognises its members' figures."},{"key":"B","text":"Offer aggregated, anonymised insights by area under a data-sharing agreement reviewed by Legal and the DPO.","effects":{"capital":150000,"trust":3,"risk":-5,"ttl":0},"feedback":"The fintech gets what it needs for targeting, GhIPSS earns a fee, and no merchant is identifiable."},{"key":"C","text":"Refuse all data sharing, since participant and merchant data should never leave GhIPSS in any form.","effects":{"capital":0,"trust":-3,"risk":0,"ttl":0},"feedback":"Safe. A legitimate, privacy-safe revenue line is left on the table."},{"key":"D","text":"Share the data for free to build goodwill, on condition the fintech keeps it confidential and internal.","effects":{"capital":-50000,"trust":3,"risk":20,"ttl":0},"feedback":"Goodwill for now. A confidentiality promise does not change what the law says about personal data."}]},"I5":{"id":"I5","kind":"inject","title":"The Audit Finding","owner":"ENABLEMENT","ownerDept":"Executive Office (Internal Audit)","accounts":[],"modules":{"primary":"M4","secondary":["M10"]},"ccp":"A31","situation":"Internal Audit finds that 40% of closed service desk tickets have no root-cause code, so repeat problems cannot be analysed. The desk says coding takes too long when queues are high. The audit report goes to the Board Audit Committee next week.","data":[{"label":"Tickets with no root-cause code","value":"40%"},{"label":"Average time to code a ticket","value":"2 minutes"},{"label":"Audit Committee","value":"Next week"}],"question":"What does the Executive Office agree as the management response?","options":[{"key":"A","text":"Make a root-cause code mandatory at closure from a short list, and review the repeat causes monthly with Platform.","effects":{"capital":200000,"trust":3,"risk":-5,"ttl":0},"feedback":"Coding takes 30 seconds from a short list. The first monthly review finds two repeat causes worth fixing."},{"key":"B","text":"Retrain all desk staff on the coding procedure, and re-audit a sample of tickets in six months' time.","effects":{"capital":50000,"trust":0,"risk":-3,"ttl":0},"feedback":"Coding improves for a month and then drifts back. The procedure was never the problem."},{"key":"C","text":"Accept the finding and schedule the fix for next year, when the new ticketing system is installed.","effects":{"capital":-100000,"trust":0,"risk":5,"ttl":0},"feedback":"A year of uncoded tickets, and a year of repeat problems nobody can see."},{"key":"D","text":"Challenge the audit sample, since the desk was under unusual pressure in the months that were tested.","effects":{"capital":-150000,"trust":0,"risk":5,"ttl":0},"feedback":"The Audit Committee reads the challenge as resistance and asks for a follow-up review."}]},"I6":{"id":"I6","kind":"inject","title":"The Renewal Invoice","owner":"SERVICE","ownerDept":"Shared Services (procurement)","accounts":["SAVANNA"],"modules":{"primary":"M9","secondary":["M10"]},"ccp":"A28","situation":"Procurement receives the annual maintenance renewal for the hardware security modules that protect gh-link PIN processing: GHS 420,000 with a four-hour on-site response. A third-party maintainer offers GHS 260,000 with next-business-day response. If the modules fail, gh-link card PIN transactions stop.","data":[{"label":"Original vendor","value":"GHS 420,000, four-hour on-site response"},{"label":"Third-party offer","value":"GHS 260,000, next business day"},{"label":"gh-link PIN transactions","value":"About 45,000 an hour at peak"}],"question":"What does Procurement recommend?","options":[{"key":"A","text":"Negotiate a two-year renewal that keeps the four-hour response, using the revenue at risk per hour as the lever.","effects":{"capital":120000,"trust":0,"risk":-5,"ttl":0},"feedback":"With revenue per hour on the table, the vendor agrees a lower annual price for two years and keeps the response time."},{"key":"B","text":"Take the third-party offer at GHS 260,000, since the modules have not failed in three years and the saving is real.","effects":{"capital":160000,"trust":0,"risk":15,"ttl":0},"feedback":"The saving is booked. A failure on a Saturday would now mean no gh-link PIN transactions until Monday."},{"key":"C","text":"Renew with the original vendor at GHS 420,000, since PIN processing is too critical for any change this year.","effects":{"capital":0,"trust":0,"risk":-3,"ttl":0},"feedback":"Safe and full price. Nobody asked what the response time is worth."},{"key":"D","text":"Defer the renewal to next quarter so the cost falls into next year's budget and protects this year's figures.","effects":{"capital":100000,"trust":0,"risk":20,"ttl":0},"feedback":"The figures look better. The modules run without maintenance cover for three months."}]}}}</script>

<script>
const ENGINE = (function (module) {
/*ENGINE:BEGIN*//*
 * Rail to Revenue: reference game engine v1.0
 * Pure, deterministic, event-sourced. No I/O, no randomness, no clock.
 * state = replay(scenario, events). The build should port this file as-is (or to TypeScript)
 * and treat it as the single source of truth for scoring.
 *
 * Event types:
 *   { id, type: "choose", nodeId, optionKey }   a team locks an option on the node in front of it
 *   { id, type: "inject", injectId }            facilitator pushes an inject (queued, played after current lock-in)
 *   { id, type: "lifeline" }                    team uses Ask the Coach
 *   { id, type: "void", targetId }              facilitator voids an earlier choose/lifeline event (mis-tap)
 */
"use strict";

const METERS = ["capital", "trust", "risk", "ttl"];

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function initialState(scenario) {
  const s = scenario.config.startState;
  return {
    capital: s.capital, trust: s.trust, risk: s.risk, ttl: s.ttl,
    flags: [], played: [], round: 1, slot: 0, routeNext: null,
    pendingInjects: [], lifelinesUsed: 0, status: "playing",
    decisions: 0, log: [], presented: null,
  };
}

function newGame(scenario) { return advance(scenario, initialState(scenario)); }

function hasFlag(state, f) { return state.flags.indexOf(f) !== -1; }
function addFlag(state, f) { if (!hasFlag(state, f)) state.flags.push(f); }
function removeFlag(state, f) { state.flags = state.flags.filter((x) => x !== f); }

function triggerMet(state, trigger) {
  if (!trigger) return false;
  const all = trigger.all || [], any = trigger.any || [], none = trigger.none || [];
  if (!all.every((f) => hasFlag(state, f))) return false;
  if (any.length && !any.some((f) => hasFlag(state, f))) return false;
  if (none.some((f) => hasFlag(state, f))) return false;
  return true;
}

function compare(a, op, b) {
  switch (op) {
    case ">=": return a >= b;
    case ">": return a > b;
    case "<=": return a <= b;
    case "<": return a < b;
    case "==": return a === b;
    default: throw new Error("Unknown operator " + op);
  }
}

function optionLocked(state, option) {
  const req = option.requires;
  if (!req) return false;
  if (req.meter) return !compare(state[req.meter], req.op, req.value);
  if (req.flag) return !hasFlag(state, req.flag);
  return false;
}

/** Resolve which node comes next. Injects queued during a decision play after that decision locks. */
function resolveNext(scenario, state) {
  if (state.status !== "playing") return null;
  if (state.pendingInjects.length) return state.pendingInjects[0];
  const round = scenario.rounds[state.round - 1];
  const slot = round.slots[state.slot];
  if (slot.kind === "node") return slot.node;
  if (slot.kind === "route") {
    if (!state.routeNext) throw new Error("Route slot reached with no route set in " + round.id);
    return state.routeNext;
  }
  if (slot.kind === "consequence") {
    const picks = slot.candidates
      .map((id) => scenario.nodes[id])
      .filter((n) => n.eligibleRounds.indexOf(round.number) !== -1)
      .filter((n) => state.played.indexOf(n.id) === -1)
      .filter((n) => triggerMet(state, n.trigger))
      .sort((a, b) => b.priority - a.priority);
    return picks.length ? picks[0].id : slot.default;
  }
  throw new Error("Unknown slot kind " + slot.kind);
}

/** The node currently in front of the team. Fixed until the team locks a choice. */
function currentNodeId(scenario, state) { return state.status === "playing" ? state.presented : null; }

function advance(scenario, state) { state.presented = resolveNext(scenario, state); return state; }

function getNode(scenario, id) {
  const n = scenario.nodes[id] || scenario.injects[id];
  if (!n) throw new Error("Unknown node " + id);
  return n;
}

function optionsFor(scenario, state, nodeId) {
  const node = getNode(scenario, nodeId);
  return node.options.map((o) => ({ key: o.key, text: o.text, locked: optionLocked(state, o), lockedReason: o.lockedReason || null }));
}

function effectiveEffects(state, option) {
  const fx = { capital: 0, trust: 0, risk: 0, ttl: 0 };

  const counts = {};

    const n = nodeOf(scn, d.nodeId), x0 = (d.round - 1) * seg;
    if (n.kind === "inject") {
      const x = x0 + ((counts[d.round] || 0) + 0.5) * (seg / 4);
      s += `<g class="tl-inj"><rect x="${(x - 7).toFixed(1)}" y="5" width="14" height="14" transform="rotate(45 ${x.toFixed(1)} 12)"/><text x="${x.toFixed(1)}" y="15.5" text-anchor="middle">${esc(d.optionKey)}</text></g>`;
      return;
    }
    counts[d.round] = (counts[d.round] || 0) + 1;
    const x = x0 + counts[d.round] * (seg / 4);
    const f = fnOf(scn, n.owner);
    const cons = /^(echo|echo_positive|curveball)$/.test(n.kind);
    s += `<g class="tl-stop${cons ? " cons " + n.kind : ""}"><circle cx="${x.toFixed(1)}" cy="34" r="${cons ? 10 : 9}" style="--own:#${f.colour}"/><text x="${x.toFixed(1)}" y="38.5" text-anchor="middle">${esc(d.optionKey)}</text>`;
    if (o.titles) s += `<title>${esc(n.title)}: option ${esc(d.optionKey)}</title>`;
    s += `</g>`;
  });
  if (state.status === "playing") {
    const done = core.filter((d) => d.round === state.round).length;
    const x = (state.round - 1) * seg + (done + 1) * (seg / 4);
    if (done < 3) s += `<circle cx="${x.toFixed(1)}" cy="34" r="9" class="tl-next"/>`;
  }
  s += `</svg>`;
  return s;
}

function b64(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
async function unseal(pin) {
  const sealed = JSON.parse($("#sealed").textContent);
  if (!(window.crypto && crypto.subtle)) throw new Error("This page must be opened over https to unlock.");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(String(pin).trim().toUpperCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(sealed.salt), iterations: sealed.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let plain;
  try { plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(sealed.iv) }, key, b64(sealed.ct)); }
  catch (e) { throw new Error("That PIN is not right."); }
  const secret = JSON.parse(new TextDecoder().decode(plain));
  const full = JSON.parse(JSON.stringify(SCN));
  full.flags = secret.flags;
  ["nodes", "injects"].forEach((bucket) => Object.keys(full[bucket]).forEach((id) => {
    const n = full[bucket][id], s = secret[bucket][id];
    NODE_SECRET.forEach((k) => { if (k in s) n[k] = s[k]; });
    n.options.forEach((o) => { o.quality = s.q[o.key]; });
  }));
  return full;
}

    if (normSession(j.session) !== normSession(S().code)) return toast(`${f.name} belongs to session ${j.session}.`, "bad");
    try { ENGINE.replay(C.full, j.events); } catch (e) { return toast(f.name + ": " + e.message, "bad"); }
    const r = upsertTeam(j.team, { events: j.events.map((e) => ({ id: e.id, type: e.type, nodeId: e.nodeId, optionKey: e.optionKey, injectId: e.injectId, targetId: e.targetId, at: e.at })), name: j.name, counts: j.counts }, "file");
    toast(r.ok ? `Team ${j.team} imported from file.` : r.msg, r.ok ? "good" : "bad"); route();
  }));
}

/* ---------- QR scanning with the laptop camera ---------- */
async function startScan(host) {
  stopScan();
  host.innerHTML = `<div class="scanner"><video id="scanV" playsinline muted></video><canvas id="scanC" hidden></canvas>
    <div class="scan-side"><h3>Scanning</h3><p>Hold each table's results code up to the camera. Every scan updates that team.</p><ul id="scanLog"></ul><button class="btn ghost small" id="scanStop">Stop scanning</button></div></div>`;
  $("#scanStop").onclick = () => { stopScan(); host.innerHTML = ""; };
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false }); }
  catch (e) { host.innerHTML = `<div class="callout bad">The camera did not start (${esc(e.name || e.message)}). Allow camera access for this site, or use Type a code.</div>`; return; }
  const v = $("#scanV"), cv = $("#scanC"), ctx = cv.getContext("2d", { willReadFrequently: true });
  v.srcObject = stream; await v.play().catch(() => {});
  let lastTxt = "", lastAt = 0, alive = true;
  C.scanStop = () => { alive = false; stream.getTracks().forEach((t) => t.stop()); C.scanStop = null; };
  const loop = () => {
    if (!alive) return;
    if (v.videoWidth) {
      const sc = Math.min(1, 720 / v.videoWidth);
      cv.width = Math.round(v.videoWidth * sc); cv.height = Math.round(v.videoHeight * sc);
      ctx.drawImage(v, 0, 0, cv.width, cv.height);
      const img = ctx.getImageData(0, 0, cv.width, cv.height);
      const q = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
      if (q && q.data && (q.data !== lastTxt || Date.now() - lastAt > 4000)) {
        lastTxt = q.data; lastAt = Date.now();
        const r = ingestCode(q.data, "scan");
        const li = document.createElement("li"); li.className = r.ok ? "good" : "bad"; li.textContent = r.msg;
        const log = $("#scanLog"); if (log) log.prepend(li);
        if (r.ok) SOUND.gain(); else SOUND.loss();
        if (r.ok) refreshRoomTable();
      }
    }
    setTimeout(loop, 180);
  };
  loop();
}
function stopScan() { if (C.scanStop) C.scanStop(); }
function refreshRoomTable() { // re-render the grid without killing the camera
  const keep = $("#scanHost"); if (!keep) return;
  const holder = document.createElement("div");
  tabRoom(holder, S(), knownTeams().map(teamView));
  const g = $(".grid"), ng = holder.querySelector(".grid");

  return [
    { r: rec.find((x) => x.id === "risk"), v: pick((a, b) => a.state.risk - b.state.risk), stat: (x) => "Risk Exposure " + x.state.risk },
    { r: rec.find((x) => x.id === "ttl"), v: pick((a, b) => a.state.ttl - b.state.ttl), stat: (x) => "Time-to-Live " + x.state.ttl + " days" },
    { r: rec.find((x) => x.id === "trust"), v: pick((a, b) => b.state.trust - a.state.trust), stat: (x) => "Partner Trust " + x.state.trust },
    { r: rec.find((x) => x.id === "top"), v: rankTeams(v)[0], stat: (x) => fmtGHSfull(x.state.capital) },

}
function echoesOf(v) {

  const f = finalOf(v.state);

}
function defaultReplay(s) {

}
function pathOf(v) { return decisionsOf(v.state); }
function firstSplit(pa, pb, from) {
  for (let i = from || 0; i < Math.max(pa.length, pb.length); i++) {
    const a = pa[i], b = pb[i];

  return -1;
}

function replayTable(s, rp, big) {
  const va = teamView(s.teams[rp.a]), vb = teamView(s.teams[rp.b]);
  const pa = pathOf(va), pb = pathOf(vb), split = firstSplit(pa, pb, 0);
  const n = Math.max(pa.length, pb.length);
  const cell = (d, i) => {
    if (!d) return `<td class="rp-c none"></td>`;
    const node = nodeOf(C.full, d.nodeId), opt = node.options.find((o) => o.key === d.optionKey);
    const fx = d.effects;
    return `<td class="rp-c ${i > rp.step ? "future" : ""}"><div class="rp-t">${esc(node.title)} <small>${esc(node.id)}</small></div>
      <div class="rp-o"><span class="q q-${d.quality}">${esc(QUALITY[d.quality] || "")}</span> <b>${esc(d.optionKey)}</b> ${!big || i === rp.step ? esc(opt.text) : ""}</div>
      <div class="rp-fx num">${fmtFx(fx.capital)}, Trust ${fmtSigned(fx.trust)}, Risk ${fmtSigned(fx.risk)}, TTL ${fmtSigned(fx.ttl)}</div>
</td>`;
  };
  let rows = "";
  for (let i = 0; i < n; i++) {
    if (big && Math.abs(i - rp.step) > 2 && i > rp.step) continue;
    rows += `<tr class="${i === split ? "split" : ""} ${i === rp.step ? "now" : ""}"><th class="num">${i + 1}${i === split ? `<span class="split-tag">First split</span>` : ""}</th>${cell(pa[i], i)}${cell(pb[i], i)}</tr>`;
    if (i === rp.step) {
      const na = pa[i] ? nodeOf(C.full, pa[i].nodeId) : null, nb = pb[i] ? nodeOf(C.full, pb[i].nodeId) : null;
      if (na && nb && na.id === nb.id) rows += `<tr class="dbrow now"><th></th><td colspan="2"><div class="rp-db">${esc(na.debrief)}</div></td></tr>`;
      else rows += `<tr class="dbrow now"><th></th><td>${na ? `<div class="rp-db">${esc(na.debrief)}</div>` : ""}</td><td>${nb ? `<div class="rp-db">${esc(nb.debrief)}</div>` : ""}</td></tr>`;
    }
  }
  return `<table class="rp ${big ? "big" : ""}"><thead><tr><th></th><th>${esc(va.t.name)} <span class="num">${fmtM(va.state.capital)}</span></th><th>${esc(vb.t.name)} <span class="num">${fmtM(vb.state.capital)}</span></th></tr></thead><tbody>${rows}</tbody></table>`;
}
function echoTable(s) {
  const v = knownTeams(s).map(teamView);
  if (!v.length) return `<p class="muted">No tables known yet.</p>`;
  const tally = {};
  v.forEach((x) => { const e = echoesOf(x); e.played.forEach((n) => { (tally[n.id] = tally[n.id] || { n, p: 0, a: 0 }).p++; }); e.auto.forEach((a) => { (tally[a.id] = tally[a.id] || { n: nodeOf(C.full, a.id), p: 0, a: 0 }).a++; }); });
