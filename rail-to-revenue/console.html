/* Rail to Revenue: shared styles. Tokens from the build brief, section 11. */
:root {
  --navy: #071E2E; --blue: #2B4DF7; --green: #12CC6F; --teal: #1F7A72;
  --ink: #1B2733; --muted: #5A6B7B; --line: #C9D1DB; --panel: #EEF1F6;
  --gain: #0E7A43; --loss: #B42318; --warn: #B7791F; --white: #FFFFFF;
  --owner-platform: #2B4DF7; --owner-control: #1F7A72; --owner-enablement: #12CC6F; --owner-service: #071E2E;
  --font: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  --serif: Cambria, Georgia, "Times New Roman", serif;
  --navy-2: #0D2B40; --navy-3: #16405C; --sky: #9FB3C8; --gain-lt: #4BE08F; --loss-lt: #FF8A80; --warn-lt: #F2B84B;
  --paper: #FFFFFF; --shadow: 0 1px 2px rgba(7, 30, 46, .08), 0 8px 24px rgba(7, 30, 46, .08);
  --map-land: #0F3550; --map-lake: #0A2A40; --map-rail: #2B4DF7; --map-bed: #0A2638; --map-hub: #12CC6F; --map-pk: #CFE3FF; --map-bad: #FF6B5E;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--panel); font-size: 18px; line-height: 1.45; font-variant-numeric: lining-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums lining-nums; }
h1, h2, h3, h4 { line-height: 1.15; margin: 0; }
p { margin: 0 0 .7em; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 52px; padding: 0 1.4em; border-radius: 10px; border: 2px solid transparent; font-weight: 700; font-size: 18px; background: var(--blue); color: #fff; text-decoration: none; transition: transform .08s, background .15s; }
.btn:hover { background: #1F3DE0; }
.btn:active { transform: translateY(1px); }
.btn:disabled { background: #AEB8C4; color: #fff; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: #fff; }
.btn.dark { background: var(--navy); }
.btn.green { background: var(--green); color: var(--navy); }
.btn.danger { background: var(--loss); }
.btn.small { min-height: 40px; padding: 0 1em; font-size: 16px; border-radius: 8px; }
.btn.big { min-height: 64px; font-size: 21px; padding: 0 2em; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

/* modal + toast */
.modal-wrap { position: fixed; inset: 0; background: rgba(7, 30, 46, .62); display: grid; place-items: center; z-index: 60; padding: 16px; animation: fadein .15s; }
.modal { background: #fff; border-radius: 16px; padding: 28px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
.modal h2 { font-size: 26px; margin-bottom: 10px; }
.modal .row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
.modal-wrap.wide .modal { width: min(860px, 100%); }
#toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 80; display: grid; gap: 8px; }
.toast { background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 10px; box-shadow: var(--shadow); font-weight: 600; transition: opacity .5s, transform .5s; }
.toast.bad { background: var(--loss); }
.toast.good { background: var(--gain); }
.toast.out { opacity: 0; transform: translateY(8px); }
@keyframes fadein { from { opacity: 0; } }

/* fields */
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field label { font-weight: 700; font-size: 16px; }
.field input { width: 100%; min-height: 56px; border: 2px solid var(--line); border-radius: 10px; padding: 0 14px; font-size: 22px; background: #fff; }
.field input:focus { border-color: var(--blue); outline: none; }
.field .hint { color: var(--muted); font-size: 15px; }
.err { color: var(--loss); font-weight: 700; min-height: 1.4em; }
.codein { letter-spacing: .3em; text-align: center; font-variant-numeric: tabular-nums; font-size: 34px !important; font-weight: 700; }

/* ---------- rail map ---------- */
.railmap { width: 100%; height: 100%; display: block; overflow: visible; }
.rm-land { fill: var(--map-land); stroke: #1E4E70; stroke-width: 1.2; stroke-linejoin: round; }
.rm-lake { fill: var(--map-lake); stroke: #123A55; stroke-width: .8; }
.rm-rail { fill: none; stroke-linecap: round; }
.rm-rail-bed { stroke: var(--map-bed); stroke-width: 7; }
.rm-rail-line { stroke: var(--map-rail); stroke-width: 2.6; opacity: .9; }
.rm-pk { fill: var(--map-pk); }
.rm-pk-bad { fill: var(--map-bad); }
.rm-st-ring { fill: var(--navy); stroke: #CFE3FF; stroke-width: 2; }
.rm-st-core { fill: var(--green); }
.rm-hub-box { fill: var(--green); stroke: #E8FFF2; stroke-width: 1.5; }
.rm-hub-mark { stroke: var(--navy); stroke-width: 2.2; stroke-linecap: round; }
.rm-label { fill: #DCE7F2; font-size: 11px; font-weight: 700; paint-order: stroke; stroke: var(--navy); stroke-width: 3px; }
.rm-label-hub { fill: #fff; font-size: 12px; }
.rm-glow { transition: opacity .6s; }
.railmap.rm-warm .rm-hub-box { fill: var(--warn-lt); }
.railmap.rm-hot .rm-hub-box { fill: var(--map-bad); animation: hubpulse 1.2s infinite; }
.railmap.rm-hot .rm-glow { opacity: .9; }
.railmap.rm-hot { --map-hub: #FF6B5E; }
@keyframes hubpulse { 50% { opacity: .55; } }

/* ---------- the line (a team's route through the quarter) ---------- */
.theline { width: 100%; height: auto; display: block; }
.tl-bed { stroke: #CDD6E1; stroke-width: 8; stroke-linecap: round; }
.tl-done { stroke: var(--navy); stroke-width: 8; stroke-linecap: round; }
.tl-sep { stroke: #fff; stroke-width: 3; }
.tl-round { fill: var(--muted); font-size: 14.5px; font-weight: 600; }
.tl-round.now { fill: var(--ink); font-weight: 700; }
.tl-stop circle { fill: var(--own); stroke: #fff; stroke-width: 3; }
.tl-stop text { fill: #fff; font-size: 12px; font-weight: 700; }
.tl-stop.cons circle { stroke: var(--warn); stroke-width: 3.5; }
.tl-stop.cons.echo_positive circle { stroke: var(--green); }
.tl-stop.cons.curveball circle { stroke: var(--loss); }
.tl-inj rect { fill: var(--loss); stroke: #fff; stroke-width: 2; }
.tl-inj text { fill: #fff; font-size: 10px; font-weight: 700; }
.tl-next { fill: #fff; stroke: var(--blue); stroke-width: 3; stroke-dasharray: 4 3; animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
.dark .tl-bed { stroke: #1A3C55; }
.dark .tl-done { stroke: #CFE3FF; }
.dark .tl-sep { stroke: var(--navy); }
.dark .tl-round { fill: var(--sky); }
.dark .tl-round.now { fill: #fff; }
.dark .tl-stop circle { stroke: var(--navy); }

/* ---------- artefacts (chrome around the JSON text) ---------- */
.artefact { position: relative; background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; color: var(--ink); }
.af-kind { position: absolute; top: 10px; right: 14px; font-size: 13px; color: var(--muted); font-weight: 600; z-index: 1; }
.af-body { padding: 20px 26px 24px; }
.af-body p { font-size: 19px; line-height: 1.55; max-width: 68ch; }
.af-h { font-size: 24px; margin-bottom: 10px; }
.af-acc { display: inline-block; background: var(--panel); border-radius: 999px; padding: 2px 12px; font-size: 14px; font-weight: 700; color: var(--navy-3); margin-bottom: 12px; }
.af-tag { display: inline-block; margin-left: 10px; background: #FFF3DC; color: #7A4E0E; border-radius: 6px; padding: 1px 9px; font-size: 14px; font-weight: 700; vertical-align: middle; }
.af-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 17px; }
.af-table th { text-align: left; font-weight: 600; color: var(--muted); padding: 9px 14px 9px 0; border-top: 1px solid #E3E8EF; width: 46%; vertical-align: top; }
.af-table td { padding: 9px 0; border-top: 1px solid #E3E8EF; font-weight: 700; vertical-align: top; font-variant-numeric: tabular-nums; }
.af-attach { margin-top: 16px; border: 1px solid #E3E8EF; border-radius: 8px; padding: 12px 16px 4px; background: #FAFBFD; }
.af-attach-h { font-size: 14px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.af-attach-h::before { content: ""; width: 14px; height: 16px; border: 2px solid var(--muted); border-radius: 2px 6px 2px 2px; }
.af-attach .af-table { margin-top: 6px; }
.af-attach .af-table tr:first-child th, .af-attach .af-table tr:first-child td { border-top: 0; }

/* email */
.af-mailhead { padding: 22px 26px 14px; border-bottom: 1px solid #E3E8EF; background: linear-gradient(#F7F9FC, #fff); }
.af-subj { font-size: 25px; font-weight: 700; margin-bottom: 12px; padding-right: 60px; }
.af-row { display: flex; gap: 10px; font-size: 16px; padding: 2px 0; }
.af-row span { width: 78px; color: var(--muted); flex: none; }
.af-billboard { margin: 16px 0 6px; }
.af-bb-board { background: var(--navy); color: #fff; border-radius: 4px; padding: 26px 24px; font-size: 26px; font-weight: 700; line-height: 1.2; box-shadow: inset 0 0 0 6px #0D2B40, 0 6px 0 #5A6B7B; position: relative; }
.af-bb-board::after { content: ""; position: absolute; right: 18px; bottom: 16px; width: 54px; height: 34px; border-radius: 5px; background: linear-gradient(135deg, var(--green), var(--blue)); }
.af-billboard figcaption { font-size: 14px; color: var(--muted); margin-top: 12px; }

/* ticket */
.af-ticket { border-top: 6px solid var(--teal); }
.af-tickethead { padding: 18px 26px 14px; background: #F4F8F8; border-bottom: 1px solid #DCE7E6; }
.af-tk-no { font-size: 15px; font-weight: 700; color: var(--teal); }
.af-tk-title { font-size: 25px; font-weight: 700; margin: 2px 0 12px; }
.af-tk-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 18px; margin: 0; font-size: 15px; }
.af-tk-meta dt { color: var(--muted); }
.af-tk-meta dd { margin: 0; font-weight: 700; }
.af-pill { display: inline-block; border-radius: 999px; padding: 0 10px; font-size: 14px; }
.af-pill.open { background: #E6F7EE; color: var(--gain); }
.af-ticket h4 { font-size: 15px; color: var(--muted); margin: 6px 0 6px; }
.af-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 0; }
.af-fields div { background: #F4F8F8; border-radius: 8px; padding: 10px 14px; }
.af-fields dt { font-size: 14px; color: var(--muted); }
.af-fields dd { margin: 2px 0 0; font-weight: 700; font-size: 17px; }

/* bridge, alert, trace: the dark ops surfaces */
.af-bridge, .af-alert, .af-trace { background: #0B2233; color: #E7EEF5; }
.af-bridge .af-kind, .af-alert .af-kind, .af-trace .af-kind { color: var(--sky); }

.af-alerthead.alert { background: #8A3A0E; }
.af-alerthead.trace { background: #16405C; }

.af-clock { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; }

.af-bridge .af-h, .af-alert .af-h, .af-trace .af-h { color: #fff; }

.af-msg { border-left: 4px solid #FF8A80; padding: 4px 0 4px 16px; margin: 6px 0 14px; }

.af-tile { background: #12324A; border-radius: 8px; padding: 12px 14px; border: 1px solid #1E4E70; }
.af-tile-v { font-size: 19px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; line-height: 1.25; }
.af-tile-l { font-size: 14px; color: var(--sky); margin-top: 4px; }
.af-lines { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 16px; }
.af-trace .af-lines th, .af-trace .af-lines td { border-top: 1px solid #1E4E70; padding: 8px 6px; text-align: left; vertical-align: top; }
.af-trace .af-lines th { color: var(--sky); font-weight: 600; width: 44%; }
.af-trace .af-lines td { color: #9CFFC8; font-weight: 700; }

/* letter and press: print surfaces */

.af-body.serif p { font-family: var(--serif); font-size: 19px; line-height: 1.6; }
.af-body.serif .af-h { font-family: var(--serif); }
.af-news { background: #FBFAF6; }
.af-masthead { display: flex; justify-content: space-between; padding: 16px 28px 10px; border-bottom: 3px double var(--ink); font-family: var(--serif); font-weight: 700; font-size: 18px; padding-right: 90px; }
.af-headline { font-family: var(--serif); font-size: 32px; line-height: 1.12; margin: 6px 0 14px; }
.af-lede::first-letter { font-size: 2.6em; float: left; line-height: .9; padding: 4px 8px 0 0; font-weight: 700; }

/* phone call */
.af-callhead { display: flex; align-items: center; gap: 18px; padding: 20px 26px; background: linear-gradient(135deg, #0D2B40, #16405C); color: #fff; padding-right: 110px; }
.af-call-ring { width: 54px; height: 54px; border-radius: 50%; background: var(--green); position: relative; flex: none; }
.af-call-ring::before { content: ""; position: absolute; inset: 15px; border: 4px solid var(--navy); border-radius: 4px 4px 14px 14px; border-top-width: 6px; }
.af-call-ring::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid var(--green); animation: ring 1.4s infinite; }
@keyframes ring { from { transform: scale(.85); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
.af-call-l { font-size: 14px; color: var(--sky); }
.af-call-who { font-size: 24px; font-weight: 700; }
.af-call-to { font-size: 15px; color: #DCE7F2; }
.af-call-t { margin-left: auto; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* social */
.af-social { background: #F7F8FA; }
.af-socialhead { display: flex; justify-content: space-between; padding: 16px 26px; background: #fff; border-bottom: 1px solid #E3E8EF; padding-right: 110px; }
.af-post { background: #fff; border: 1px solid #E3E8EF; border-radius: 12px; padding: 14px 16px 4px; margin: 6px 0 12px; }
.af-social .af-tile { background: #fff; border-color: #E3E8EF; }
.af-social .af-tile-v { color: var(--ink); }
.af-social .af-tile-l { color: var(--muted); }

/* critical path wall */
.af-wall { background: #C9B18A; background-image: radial-gradient(rgba(0, 0, 0, .06) 1px, transparent 1px); background-size: 6px 6px; }
.af-wall .af-kind { color: #4E3B1D; }
.af-wallhead { display: flex; justify-content: space-between; padding: 14px 26px; color: #3B2C14; padding-right: 150px; }
.af-card { background: #fff; padding: 18px 20px 6px; border-radius: 3px; box-shadow: 0 6px 14px rgba(0, 0, 0, .18); transform: rotate(-.4deg); }
.af-notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-top: 18px; }
.af-note { padding: 14px; border-radius: 2px; box-shadow: 0 4px 10px rgba(0, 0, 0, .18); font-size: 16px; display: grid; gap: 6px; }
.af-note b { font-size: 14px; font-weight: 700; opacity: .8; }
.af-note span { font-size: 19px; font-weight: 700; }
.af-note.n0 { background: #FFF27A; transform: rotate(-1.4deg); }
.af-note.n1 { background: #9EF0C4; transform: rotate(1.1deg); }
.af-note.n2 { background: #FFC6D2; transform: rotate(-.6deg); }
.af-note.n3 { background: #B9D3FF; transform: rotate(1.6deg); }

/* meeting and calendar */
.af-calhead { display: flex; gap: 18px; align-items: center; padding: 20px 26px; border-bottom: 1px solid #E3E8EF; padding-right: 100px; }
.af-cal-day { width: 92px; min-height: 76px; border-radius: 10px; background: var(--teal); color: #fff; display: grid; place-items: center; text-align: center; font-weight: 700; padding: 8px; flex: none; font-size: 16px; line-height: 1.2; }
.af-cal-l { font-size: 14px; color: var(--muted); font-weight: 700; }
.af-cal-t { font-size: 25px; font-weight: 700; }
.af-cal-to { font-size: 15px; color: var(--muted); }

/* invoice */
.af-invhead { display: flex; justify-content: space-between; gap: 18px; padding: 22px 26px 16px; border-bottom: 2px solid var(--ink); padding-right: 90px; }
.af-inv-l { font-size: 30px; font-weight: 700; letter-spacing: .02em; color: var(--navy); }
.af-inv-t { font-size: 18px; font-weight: 700; color: var(--muted); }
.af-inv-meta { font-size: 15px; color: var(--muted); text-align: right; }
.af-invoice .af-lines th, .af-invoice .af-lines td { padding: 10px 0; border-bottom: 1px dashed var(--line); text-align: left; vertical-align: top; }
.af-invoice .af-lines td { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; padding-left: 12px; }

/* paper for decision */
.af-paperhead { padding: 24px 26px 14px; border-bottom: 1px solid #E3E8EF; position: relative; }
.af-stamp { position: absolute; right: 24px; top: 34px; border: 3px solid var(--loss); color: var(--loss); font-weight: 700; padding: 2px 12px; border-radius: 6px; transform: rotate(-6deg); font-size: 17px; opacity: .85; }
.af-paper-l { font-size: 15px; color: var(--muted); font-weight: 700; }
.af-paper-t { font-size: 27px; font-weight: 700; margin: 4px 0 6px; padding-right: 150px; }
.af-paper-to { font-size: 15px; color: var(--muted); }

/* memo and report */
.af-dochead { padding: 22px 26px 14px; border-bottom: 1px solid #E3E8EF; }
.af-dochead.report { border-top: 6px solid var(--blue); }
.af-doc-l { font-size: 15px; color: var(--muted); font-weight: 700; }
.af-doc-t { font-size: 26px; font-weight: 700; margin: 4px 0 10px; }
.af-doc-meta { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 15px; color: var(--muted); }
.af-doc-meta .af-tag { margin-left: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}

/* Rail to Revenue: facilitator console and projector */
body.console { font-size: 16px; background: #E6EAF0; }
.muted { color: var(--muted); }
.bad { color: var(--loss); }
.h-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--green); flex: none; position: relative; display: inline-block; }
.h-mark::before, .h-mark::after { content: ""; position: absolute; left: 7px; right: 7px; height: 3px; border-radius: 2px; background: var(--navy); }
.h-mark::before { top: 9px; } .h-mark::after { bottom: 9px; }
.h-ico { width: 42px; height: 42px; border-radius: 9px; border: 1px solid #1E4E70; background: transparent; color: #fff; font-size: 18px; }

/* unlock */
.unlock { min-height: 100vh; display: grid; place-items: center; background: var(--navy); padding: 20px; }
.unlock-card { background: var(--panel); border-radius: 18px; padding: 34px; width: min(520px, 100%); }
.u-mark { width: 44px; height: 44px; border-radius: 10px; background: var(--green); position: relative; margin-bottom: 14px; }
.u-mark::before, .u-mark::after { content: ""; position: absolute; left: 11px; right: 11px; height: 4px; border-radius: 2px; background: var(--navy); }
.u-mark::before { top: 14px; } .u-mark::after { bottom: 14px; }
.unlock h1 { font-size: 32px; color: var(--navy); margin-bottom: 8px; }
.unlock .btn { width: 100%; }

/* top bar and tabs */
.ctop { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; background: var(--navy); color: #fff; padding: 10px 18px; min-height: 64px; }
.c-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.c-brand b { font-size: 19px; white-space: nowrap; } .c-brand span:not(.h-mark) { color: var(--sky); white-space: nowrap; }
.c-status { display: flex; gap: 8px; margin: 0 auto; flex-wrap: wrap; }
.chip { background: #12324A; border: 1px solid #1E4E70; border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--sky); }
.chip b { color: #fff; }
.timer-chip { color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
.c-topr { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.btn.ghost-d { background: transparent; color: #fff; border-color: #1E4E70; }
.ctabs { position: sticky; top: 64px; z-index: 29; display: flex; gap: 2px; background: #fff; border-bottom: 1px solid var(--line); padding: 0 12px; overflow-x: auto; }
.ctabs button { border: 0; background: none; padding: 14px 16px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.ctabs button[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--blue); }
.cmain { padding: 18px; max-width: 1600px; margin: 0 auto; }

/* panels */
.c-panel { background: #fff; border-radius: 12px; padding: 20px 22px; box-shadow: var(--shadow); margin-bottom: 16px; }
.c-panel h2 { font-size: 21px; color: var(--navy); margin-bottom: 10px; }
.c-panel h2.mt { margin-top: 22px; }
.chome { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; padding: 22px; max-width: 1300px; margin: 0 auto; }
.ns .field input { font-size: 18px; min-height: 48px; }
.rehearse { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 16px; }
.rehearse h3 { font-size: 18px; margin-bottom: 6px; }
.slist { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.sbtn { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 16px; display: grid; gap: 2px; }
.sbtn:hover { border-color: var(--blue); background: #fff; }
.sbtn b { font-size: 18px; color: var(--navy); } .sbtn small { color: var(--muted); }
.ioline { margin-top: 14px; }

/* toolbar, grid */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.tb-note { color: var(--muted); font-size: 14px; flex: 1 1 280px; }
.bots { display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 10px; padding: 8px 14px; box-shadow: var(--shadow); }
.bots select { min-height: 36px; border-radius: 8px; border: 1px solid var(--line); padding: 0 8px; }
.grid { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); font-size: 15px; }
.grid th { text-align: left; background: #F4F6F9; color: var(--muted); font-size: 13px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.grid td { padding: 10px 12px; border-bottom: 1px solid #EDF0F4; vertical-align: top; }
.grid .r { text-align: right; }
.grid tr.empty td { color: var(--muted); }
.grid .tn { font-weight: 700; }
.grid .where { max-width: 280px; }
.grid .src { font-size: 13px; color: var(--muted); }
.own { display: inline-block; border-radius: 6px; padding: 1px 8px; font-weight: 700; font-size: 13px; color: #fff; }
.own-platform { background: var(--owner-platform); } .own-control { background: var(--owner-control); } .own-enablement { background: var(--owner-enablement); color: var(--navy); } .own-service { background: var(--owner-service); }
.callout { background: #EEF2FF; border-left: 5px solid var(--blue); border-radius: 10px; padding: 12px 16px; margin: 0 0 14px; }
.callout.bad { background: #FFF1EF; border-color: var(--loss); color: var(--ink); }
.callout.warn { background: #FFF6E5; border-color: var(--warn); }

/* scanner */
.scanner { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr); gap: 16px; background: var(--navy); border-radius: 12px; padding: 14px; margin-bottom: 16px; color: #fff; }
.scanner video { width: 100%; border-radius: 8px; background: #000; transform: scaleX(-1); }
.scan-side p { color: var(--sky); }
#scanLog { list-style: none; padding: 0; margin: 0 0 12px; max-height: 260px; overflow: auto; display: grid; gap: 6px; }
#scanLog li { padding: 8px 10px; border-radius: 8px; font-size: 14px; }
#scanLog li.good { background: rgba(18, 204, 111, .18); } #scanLog li.bad { background: rgba(255, 107, 94, .2); }
.scan-side .btn.ghost { color: #fff; border-color: #1E4E70; }

/* pace */
.pace { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr); gap: 16px; }
.rounds { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.rcard { border: 2px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; background: var(--panel); }
.rcard.open { background: #E8F7EF; border-color: var(--gain); }
.rcard.next { border-color: var(--blue); background: #fff; }
.rc-n { font-weight: 700; color: var(--teal); font-size: 14px; } .rc-t { font-weight: 700; color: var(--navy); line-height: 1.2; } .rc-d { font-size: 13px; color: var(--muted); }
.rc-code { margin-top: 6px; display: flex; justify-content: space-between; align-items: baseline; } .rc-code span { font-size: 13px; color: var(--muted); } .rc-code b { font-size: 24px; letter-spacing: .08em; }
.rc-s { font-size: 13px; color: var(--muted); }
.pace-go { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 12px; }
.tog { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.tog input { width: 20px; height: 20px; }
.bigtimer { font-size: 84px; font-weight: 700; color: var(--navy); line-height: 1; margin: 6px 0 14px; }
.trow { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.views { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.vbtn { border: 2px solid var(--line); background: var(--panel); border-radius: 10px; min-height: 52px; font-weight: 700; color: var(--navy); }
.vbtn.on { background: var(--navy); color: #fff; border-color: var(--navy); }

/* curveballs */
.injs { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.inj { background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; border-top: 5px solid var(--loss); }
.inj header { display: flex; gap: 10px; align-items: center; }
.inj-code { margin-left: auto; color: var(--muted); } .inj-code b { color: var(--ink); font-size: 20px; letter-spacing: .06em; }
.inj h3 { font-size: 20px; color: var(--navy); }
.inj-best { font-weight: 700; color: var(--teal); margin: 0; font-size: 14px; }
.inj-sit { font-size: 15px; color: var(--ink); flex: 1; }
.inj-stat { font-size: 13px; color: var(--muted); }
.inj-go { display: flex; gap: 8px; flex-wrap: wrap; }
.giant { font-size: 92px; font-weight: 700; letter-spacing: .12em; text-align: center; color: var(--navy); margin: 10px 0; }
.modal select, .modal textarea { width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 10px; font-size: 16px; }

/* coach */
.coachv { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
.cues { display: grid; gap: 10px; }
.cue { background: var(--panel); border-radius: 10px; padding: 12px 14px; border-left: 5px solid var(--teal); }
.cue-h { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.cue-h span { color: var(--muted); font-size: 14px; }
.cue p { margin: 6px 0 0; font-size: 18px; font-weight: 600; color: var(--navy); }

/* debrief */
.debrief { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.debrief .wide { grid-column: 1 / -1; }
.lb-mini { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 6px; }
.lb-mini li { display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 10px; align-items: baseline; background: var(--panel); border-radius: 8px; padding: 8px 12px; }
.lb-mini small { grid-column: 2 / -1; color: var(--muted); }
.recs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.recs div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; }
.recs b { color: var(--teal); font-size: 14px; } .recs span { font-weight: 700; font-size: 18px; } .recs small { color: var(--muted); }
.rp-pick { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.rp-pick select { min-height: 40px; border-radius: 8px; border: 1px solid var(--line); padding: 0 8px; margin-left: 6px; }
.rp { width: 100%; border-collapse: collapse; table-layout: fixed; }
.rp th, .rp td { border-bottom: 1px solid #EDF0F4; padding: 8px 10px; vertical-align: top; text-align: left; }
.rp thead th { font-size: 16px; color: var(--navy); }
.rp thead th:first-child { width: 70px; }
.rp tbody th { color: var(--muted); }
.rp tr.dbrow td { padding-top: 0; }
.rp tr.split { background: #FFF6E5; }
.rp tr.now { outline: 3px solid var(--blue); outline-offset: -3px; }
.split-tag { display: block; font-size: 11px; color: #8A5A12; font-weight: 700; }
.rp-c.future { opacity: .3; }
.rp-t { font-weight: 700; } .rp-t small { color: var(--muted); font-weight: 600; }
.rp-o { margin: 2px 0; } .rp-fx { font-size: 13px; color: var(--muted); }
.rp-db { margin-top: 6px; background: #EEF2FF; border-radius: 8px; padding: 8px 10px; font-size: 15px; }
.q { display: inline-block; border-radius: 6px; padding: 0 8px; font-weight: 700; font-size: 13px; color: #fff; }
.q-best { background: var(--gain); } .q-strong { background: var(--teal); } .q-weak { background: #8A5A12; } .q-poor { background: var(--loss); }
.printv, .setupv { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; align-items: start; }
.codes td { text-align: center; } .codes td small { display: block; color: var(--muted); } .codes td b { font-size: 22px; letter-spacing: .06em; }
.tname { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 220px; }

@media (max-width: 1100px) { .pace, .coachv, .debrief, .chome { grid-template-columns: 1fr; } .rounds { grid-template-columns: repeat(3, 1fr); } }

/* =================== projector (1920 x 1080; read from the back row) =================== */
body.screen { background: var(--navy); color: #fff; font-size: 34px; overflow: hidden; }
.scr { min-height: 100vh; padding: 5vh 5vw; position: relative; }
.scr h1 { font-size: 92px; letter-spacing: -.01em; }
.scr-wait { display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 4vw; }
.sw-k { color: var(--green); font-weight: 700; font-size: 32px; }
.sw-sub { font-size: 46px; color: var(--sky); margin: 8px 0 60px; }
.sw-join { display: inline-grid; background: #0D2B40; border: 2px solid #1E4E70; border-radius: 20px; padding: 26px 36px; }
.sw-join span { color: var(--sky); font-size: 32px; } .sw-join b { font-size: 96px; letter-spacing: .04em; line-height: 1.1; } .sw-join small { color: var(--sky); font-size: 28px; }
.sw-label { margin-top: 30px; color: var(--sky); font-size: 34px; }
.sw-map, .sr-map { height: 84vh; }
.scr-round { display: grid; grid-template-columns: 1fr 1fr; gap: 4vw; align-items: center; }
.sr-k { color: var(--green); font-weight: 700; font-size: 40px; }
.scr-round h1 { font-size: 110px; line-height: 1; margin: 10px 0; }
.sr-d { font-size: 44px; color: var(--sky); }
.sr-code { margin-top: 50px; display: inline-grid; background: var(--green); color: var(--navy); border-radius: 20px; padding: 20px 36px; animation: rise .6s; }
.sr-code span { font-size: 34px; font-weight: 700; } .sr-code b { font-size: 132px; letter-spacing: .1em; line-height: 1; }
.sr-set { margin-top: 36px; font-size: 36px; color: var(--sky); }
.sr-r { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
.sr-r .sr-map { height: 58vh; width: 100%; }
.sr-timer { font-size: 230px; font-weight: 700; line-height: 1; letter-spacing: -.01em; }
.sr-timer.low { color: var(--warn-lt); } .sr-timer.zero { color: var(--loss-lt); animation: blink 1s infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(30px); } }
.scr-inj { position: fixed; inset: 0 0 auto 0; z-index: 10; background: var(--loss); color: #fff; padding: 28px 5vw; display: grid; grid-template-columns: auto 1fr; column-gap: 40px; align-items: center; animation: alarmbar 1s 4; box-shadow: 0 10px 40px rgba(0, 0, 0, .4); }
.si-l { grid-row: span 3; font-size: 40px; font-weight: 700; border: 5px solid #fff; border-radius: 14px; padding: 10px 22px; }
.si-t { font-size: 64px; font-weight: 700; line-height: 1.05; } .si-c { font-size: 38px; } .si-c b { font-size: 60px; letter-spacing: .08em; } .si-n { font-size: 30px; opacity: .9; }
@keyframes alarmbar { 50% { background: #7A1209; } }
.scr-board h1 { font-size: 72px; } .sb-sub { color: var(--sky); font-size: 34px; margin-bottom: 22px; }
.sb-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.sb-list li { display: grid; grid-template-columns: 70px minmax(260px, 420px) 1fr 330px 150px; align-items: center; gap: 24px; background: #0D2B40; border-radius: 16px; padding: 10px 24px; animation: rise .5s both; }
.sb-list li:nth-child(2) { animation-delay: .1s; } .sb-list li:nth-child(3) { animation-delay: .2s; } .sb-list li:nth-child(4) { animation-delay: .3s; } .sb-list li:nth-child(5) { animation-delay: .4s; } .sb-list li:nth-child(6) { animation-delay: .5s; }
.sb-rank { font-size: 60px; font-weight: 700; color: var(--green); }
.sb-name { font-size: 42px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-bar { height: 34px; background: #12324A; border-radius: 17px; overflow: hidden; }
.sb-bar i { display: block; height: 100%; width: var(--w); background: linear-gradient(90deg, var(--blue), var(--green)); border-radius: 17px; animation: grow 1.2s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes grow { from { width: 0; } }
.sb-cap { font-size: 52px; font-weight: 700; text-align: right; white-space: nowrap; }
.sb-m { font-size: 21px; color: var(--sky); line-height: 1.2; }
.scr-reveal { display: grid; place-items: center; text-align: center; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.rv-in { animation: rise .8s cubic-bezier(.2, .8, .2, 1); position: relative; z-index: 6; }
.rv-k { color: var(--sky); font-size: 40px; }
.rv-award { font-size: 120px !important; color: var(--green); margin: 10px 0 20px; }
.rv-team { font-size: 110px; font-weight: 700; }
.rv-stat { font-size: 52px; color: var(--sky); margin-top: 10px; }
.scr-replay h1, .scr-echo h1 { font-size: 72px; margin-bottom: 20px; }
.rp.big { font-size: 30px; }
.rp.big th, .rp.big td { border-bottom-color: #1A3C55; }
.rp.big thead th { color: #fff; font-size: 36px; }
.rp.big thead th:first-child { width: 130px; }
.rp.big tbody th { color: var(--sky); font-size: 32px; }
.rp.big .rp-t small, .rp.big .rp-fx { color: var(--sky); font-size: 26px; }
.rp.big tr.split { background: rgba(242, 184, 75, .16); }
.rp.big tr.now { outline-color: var(--green); }
.rp.big .split-tag { color: var(--warn-lt); font-size: 20px; }
.rp.big .rp-db { background: #12324A; color: #fff; font-size: 30px; }
.rp.big .q { font-size: 24px; padding: 2px 12px; }
.se-sub { color: var(--sky); font-size: 34px; max-width: 46ch; }
.scr-echo .grid { background: #0D2B40; color: #fff; font-size: 27px; box-shadow: none; }
.scr-echo .grid td { padding: 7px 14px; }
.scr-echo .grid small { display: none; }
.scr-echo h1 { margin-bottom: 8px !important; }
.scr-echo .se-sub { font-size: 28px; max-width: none; margin-bottom: 16px; }
.scr-echo .grid th { background: #12324A; color: var(--sky); font-size: 24px; border-color: #1A3C55; }
.scr-echo .grid td { border-color: #1A3C55; }
.scr-echo .grid small { color: var(--sky); }
body.screen .railmap .rm-label { font-size: 12px; }

<script type="application/json" id="scenario">{"schemaVersion":"1.0","meta":{"id":"rail-to-revenue","title":"Rail to Revenue","subtitle":"One Quarter at GhIPSS","version":"1.0","date":"2026-10-07","client":"Ghana Interbank Payment and Settlement Systems (GhIPSS)","programme":"Commercial Mindset and Revenue Mechanics","track":"Commercial Enablement for Support Functions (Day Two II)","provider":"The Payment School, Intreensic Limited","deliveryDays":["Wednesday 21 October 2026 (Cohort A)","Thursday 22 October 2026 (Cohort B)"],"durationMinutes":90,"currency":"GHS","illustrativeNotice":"All capital values, fees, volumes and times in this simulation are illustrative game figures. They are not GhIPSS financials and must be aligned with the Day Two II workbook figures before delivery."},"config":{"startState":{"capital":10000000,"trust":50,"risk":30,"ttl":120},"bounds":{"trust":[0,100],"risk":[0,100],"ttl":[30,180]},"timing":{"discussionSeconds":90,"decisionSeconds":180,"overtimeFlagSeconds":240},"lifelines":{"askTheCoach":{"perTeam":2,"cost":150000,"rule":"A cluster coach comes to the table for 60 seconds and may ask one challenge question. The coach never names an option."}},"roundSettlement":{"trust":[{"min":70,"max":100,"capital":250000,"note":"High Partner Trust: partners route more volume over GhIPSS rails."},{"min":40,"max":69,"capital":0,"note":"Partner Trust steady: no volume effect."},{"min":0,"max":39,"capital":-250000,"note":"Low Partner Trust: volume leaks to bilateral and proprietary routes."}],"risk":[{"min":0,"max":44,"capital":0,"note":"Risk Exposure contained."},{"min":45,"max":59,"capital":-150000,"note":"Elevated Risk Exposure: control remediation costs."},{"min":60,"max":100,"capital":-350000,"note":"High Risk Exposure: remediation and penalty costs."}],"triggers":[{"meter":"risk","op":">=","value":60,"setFlag":"cb_regulator","note":"Regulator curveball becomes eligible next round."},{"meter":"trust","op":"\u003c","value":35,"setFlag":"cb_partner","note":"Partner escalation curveball becomes eligible next round."},{"meter":"capital","op":"\u003c","value":9000000,"setFlag":"cb_exco","note":"ExCo review curveball becomes eligible next round."}]},"finalSettlement":{"ttlBaseline":120,"ttlValuePerDay":15000,"note":"Each day of Time-to-Live below 120 is worth GHS 15,000 of revenue earned earlier. Each day above 120 costs the same.","autoResolve":"Any echo or curveball that was triggered but never reached a decision slot is settled automatically at its auto-resolve value. The bill arrives whether or not the squad got to decide on it."},"scoring":{"primary":"Final capital","tieBreakers":["Partner Trust (higher)","Risk Exposure (lower)","Time-to-Live (lower)"],"recognitions":[{"id":"top","name":"Revenue Engine Award","rule":"Highest final capital"},{"id":"trust","name":"Partner's Choice","rule":"Highest final Partner Trust"},{"id":"ttl","name":"First to Live","rule":"Lowest final Time-to-Live"},{"id":"risk","name":"Clean Rail","rule":"Lowest final Risk Exposure"}],"stakes":"Formative. Scores carry no weight toward either certificate. Each team's decision log feeds candidate actions into the Commercial Contribution Plan."}},"meters":[{"id":"capital","name":"Capital","unit":"GHS","start":10000000,"better":"higher","meaning":"The commercial value the squad earns or protects for GhIPSS across the quarter. Game currency only."},{"id":"trust","name":"Partner Trust","unit":"points (0 to 100)","start":50,"better":"higher","meaning":"How far the four partner institutions believe GhIPSS will act in their interest. Drives volume and unlocks options that need a partner's cooperation."},{"id":"risk","name":"Risk Exposure","unit":"points (0 to 100)","start":30,"better":"lower","meaning":"Accumulated operational, security, compliance and conduct risk. High exposure costs money and calls in the regulator."},{"id":"ttl","name":"Time-to-Live","unit":"days","start":120,"better":"lower","meaning":"Projected median days from contract signature to first live transaction across the squad's pipeline. Target 60. Mirrors the level 4 metric the programme is built to move."}],"functions":[{"id":"PLATFORM","name":"Platform","departments":["Technology"],"owns":"Integration, certification, monitoring, incidents, capacity, change control","colour":"2B4DF7"},{"id":"CONTROL","name":"Control","departments":["Finance and Strategy","Enterprise Risk and Compliance","Legal"],"owns":"Pricing, cost to serve, budgets, billing, fraud, compliance, contracts, liability","colour":"1F7A72"},{"id":"ENABLEMENT","name":"Enablement","departments":["Brand and Communications","People and Culture","Executive Office (incl. Internal Audit)"],"owns":"Messaging, incident communications, capacity and incentives, agenda setting, sponsor decisions, audit","colour":"12CC6F"},{"id":"SERVICE","name":"Service","departments":["Shared Services"],"owns":"Service desk, document handling, procurement, facilities, administration","colour":"071E2E"}],"modules":[{"id":"M1","day":1,"minutes":90,"title":"Think Commercially: How GhIPSS Earns","keyIdeas":["GhIPSS earns a fee on each transaction its participants route over its rails, so revenue is fee multiplied by volume across four product families.","A transaction can be decomposed from fee to cost to serve to contribution.","Participants adopt when the economics work on their own P&L. The gh-link interchange lesson, generalised."]},{"id":"M2","day":1,"minutes":105,"title":"One Team, One Revenue Engine","keyIdeas":["Every function sits somewhere on the revenue chain, including those that never meet a partner.","Revenue leaks at hand-offs between functions, and a leak with no owner stays open.","Ownership means holding a decision until it reaches the person who can act on it."]},{"id":"M3","day":1,"minutes":75,"title":"See the Customer, Not the Product","keyIdeas":["The customer is a regulated institution with its own P&L, operation and constraints.","GhIPSS serves nine buyer types, from banks and fintechs to agents and government.","Understanding the partner's operation finds problems and opportunities the product view misses."]},{"id":"M4","day":1,"minutes":50,"title":"From Signal to Opportunity","keyIdeas":["Signals arrive disguised as tickets, complaints, variances and awkward requests.","A signal becomes an opportunity once it has an owner, a number and a date.","Signals need a route: the leak board and the Parking Board."]},{"id":"M9","day":2,"minutes":90,"title":"The Economics of My Function","keyIdeas":["Every function has a cost, and each one earns, protects or enables revenue.","Cost to serve has a marginal part that moves with volume and a fixed part that does not.","Each function owns at least one commercial lever (A26 to A28)."]},{"id":"M10","day":2,"minutes":105,"title":"Service Level as a Commercial Instrument","keyIdeas":["Service levels are part of the product partners buy.","An incident is a commercial event: partners count the cost and decide whether to route around GhIPSS.","The escalation trace runs from a branch counter to ExCo (A29), and every link in it is a service commitment (A30, A31)."]},{"id":"M11","day":2,"minutes":75,"title":"Signed Is Not Live: The Activation Critical Path","keyIdeas":["Revenue starts at the first live transaction, so every day between signature and live is revenue sold and not yet earned.","Most delays between signature and live sit in support functions: legal, certification, documents, billing, training.","Map the current-state critical path (A32), then remove one delay you own (A33)."]},{"id":"M12","day":2,"minutes":60,"title":"The Commercial Contribution Plan","keyIdeas":["A plan has three actions at most, each sourced from A28, A31 or A33.","The specificity standard has four criteria: a verifiable action, a commercial link, an existing measure, and traceability and agreement.","Commitments are made to the sponsor (A35) and tested through cross-cluster pairing (A36)."]}],"ccpTypes":{"A28":"A lever in my function's economics (from M9)","A31":"A service commitment that protects revenue (from M10)","A33":"A delay I own on the activation critical path (from M11)"},"accounts":[{"id":"ADEPA","name":"Adepa Pay","buyerType":"Fintech","products":["GIP Payment Gateway","GhQR"],"cluster":"Platform case in Day Two II","situation":"Licensed fintech with 1,200 merchants. Signed on Day 0 to join GIP through the Payment Gateway and accept GhQR. Not yet live."},{"id":"SAVANNA","name":"Savanna Commercial Bank","buyerType":"Bank","products":["gh-link issuing and acquiring","GIP"],"cluster":"Control case in Day Two II","situation":"Tier-two bank scaling gh-link debit cards from 85,000 to 250,000 and growing POS acquiring. Heavy GIP sender. Also issues Visa debit."},{"id":"UNITY","name":"Unity Trust Bank","buyerType":"Bank (with agents and merchants as extended customers)","products":["GhanaPay Mobile Money","GhQR"],"cluster":"Enablement case in Day Two II","situation":"Rolling out GhanaPay through 600 agents, 41% in the northern regions, and signing 2,000 merchants."},{"id":"AKWAABA","name":"Akwaaba Insurance through Meridian Bank","buyerType":"Corporate biller through a bank","products":["CCC/ACH direct debit"],"cluster":"Service case in Day Two II","situation":"Insurer collecting 18,000 monthly premiums by ACH direct debit through Meridian Bank. Returns are high. Meridian is also a GIP participant."}],"rounds":[{"id":"R1","number":1,"title":"Know the Money","days":"Days 1 to 18","modules":["M1","M9"],"brief":"Day 1 of the quarter. Four accounts are signed, the budget review is three weeks away, and the MD wants every function to show what it earns or protects. Start with the money.","slots":[{"kind":"node","node":"N1.1"},{"kind":"route"},{"kind":"consequence","candidates":[],"default":"N1.3"}]},{"id":"R2","number":2,"title":"Hear the Signal","days":"Days 19 to 36","modules":["M3","M4","M10"],"brief":"Signals rarely arrive labelled as opportunities. They come in as tickets, complaints, variances and awkward requests. This round tests whether the squad hears them and gets them to someone who can act.","slots":[{"kind":"node","node":"N2.1"},{"kind":"route"},{"kind":"consequence","candidates":["CB_REGULATOR","CB_PARTNER","CB_EXCO","E_ADEPA_DETOUR","E_MANDATE"],"default":"N2.3"}]},{"id":"R3","number":3,"title":"The Incident","days":"Days 37 to 54","modules":["M10","M2"],"brief":"A service failure is a commercial event. Every minute it runs, partners count the cost, customers lose confidence, and someone decides whether to route around GhIPSS next time.","slots":[{"kind":"node","node":"N3.1"},{"kind":"route"},{"kind":"consequence","candidates":["CB_REGULATOR","CB_PARTNER","CB_EXCO","E_ADEPA_DETOUR","E_MANDATE"],"default":"N3.3"}]},{"id":"R4","number":4,"title":"Signed Is Not Live","days":"Days 55 to 72","modules":["M11","M3"],"brief":"Two contracts are signed and neither is live. Every day between signature and first live transaction is revenue GhIPSS has sold and cannot yet earn. Most of the delay sits in support functions.","slots":[{"kind":"node","node":"N4.1"},{"kind":"route"},{"kind":"consequence","candidates":["CB_REGULATOR","CB_PARTNER","CB_EXCO","E_UNAPPROVED_CHANGE","E_SILENT_INCIDENT","E_WAIVER_PRECEDENT","E_GHLINK_CLAIM","E_SIGNAL_MISSED","E_ADEPA_DETOUR","E_EVENING_WIN"],"default":"N4.3"}]},{"id":"R5","number":5,"title":"Own the Quarter","days":"Days 73 to 90","modules":["M12","M2","M1"],"brief":"The quarter closes in 18 days. The bills for earlier choices arrive, the sponsor wants commitments, and every function has to say what it will own next.","slots":[{"kind":"consequence","candidates":["CB_REGULATOR","CB_PARTNER","CB_EXCO","E_CERT_BREACH","E_UNAPPROVED_CHANGE","E_SILENT_INCIDENT","E_WAIVER_PRECEDENT","E_GHLINK_CLAIM","E_BURNOUT","E_SIGNAL_MISSED","E_TEMPLATE_DIVIDEND","E_EVENING_WIN"],"default":"N5.1"},{"kind":"node","node":"N5.2"},{"kind":"route"}]}],"nodes":{"N1.1":{"id":"N1.1","kind":"spine","round":1,"title":"The Fee Waiver Request","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["ADEPA"],"modules":{"primary":"M1","secondary":["M3","M2"]},"ccp":"A28","situation":"Adepa Pay signed on Day 0 to join GIP through the Payment Gateway and to accept GhQR at its 1,200 merchants. Its CEO has written to the GhIPSS MD asking for a six-month waiver of all GhIPSS fees \"to build volume\". The MD has forwarded it to Finance with one line: \"Your recommendation by Friday.\" Three other fintechs are negotiating terms right now, and they talk to each other.","data":[{"label":"Adepa forecast","value":"50,000 GIP transactions in month 1, rising to 400,000 by month 6 (1.2 million over six months)"},{"label":"Illustrative GhIPSS fee","value":"GHS 0.75 per GIP transaction"},{"label":"Adepa's own customer charge","value":"GHS 1.50 per transfer"},{"label":"Value of the six-month waiver","value":"About GHS 900,000"}],"question":"What does Finance recommend to the MD?","options":[{"key":"A","text":"Approve the full six-month waiver as asked, because early volume matters most and Adepa will remember who backed it.","effects":{"capital":-300000,"trust":10,"risk":0,"ttl":-5},"feedback":"Adepa is delighted and the MD signs. GhIPSS has given away about GHS 900,000 with no floor and no end date, and three other fintechs will hear about it.","route":"N1.2a","setFlags":["waiver_precedent"]},{"key":"B","text":"Decline the request outright, since GhIPSS fees are approved by the board and apply equally to every participant.","effects":{"capital":100000,"trust":-10,"risk":0,"ttl":10},"feedback":"Sound on governance and cold on commercial sense. Adepa's CEO reads it as a closed door and quietly slows the integration while it tests a direct mobile money route.","route":"N1.2c","setFlags":["adepa_cold"]},{"key":"C","text":"Pass the request to Business Development, since pricing conversations with partners belong to the commercial team.","effects":{"capital":-100000,"trust":-5,"risk":0,"ttl":10},"feedback":"BD waits for Finance's numbers and Finance waits for BD. Ten days pass with no answer, which Adepa treats as a no. Finance owns the economics of the deal even when BD owns the conversation.","route":"N1.2c","setFlags":["adepa_cold"]},{"key":"D","text":"Offer a stepped launch rebate tied to volume milestones, keep a fee floor, and publish one end date for every fintech.","effects":{"capital":300000,"trust":5,"risk":-5,"ttl":-5},"feedback":"Adepa gets help at launch and GhIPSS keeps a floor on every transaction. Because the terms are published, the next three fintechs get the same offer and no fresh negotiation.","route":"N1.2b","setFlags":["tiered_rebate"]}]},"N1.2a":{"id":"N1.2a","kind":"branch","round":1,"title":"Free Rides Cost Money","owner":"PLATFORM","ownerDept":"Technology","accounts":["ADEPA"],"modules":{"primary":"M9","secondary":["M1"]},"ccp":"A28","situation":"With fees waived, Adepa's integration lead asks for a dedicated test environment and weekend engineering support until launch. Platform estimates the cost at GHS 180,000 for the quarter. Adepa will pay GhIPSS nothing for six months. Two banks are already waiting in the shared certification queue.","data":[{"label":"Dedicated sandbox and weekend on-call","value":"GHS 180,000 this quarter"},{"label":"Revenue from Adepa during the waiver","value":"GHS 0"},{"label":"Shared certification queue today","value":"15 working days"}],"question":"How does Platform respond?","options":[{"key":"A","text":"Provide the dedicated environment and weekend support, because the MD backed this partner and a slow launch looks bad.","effects":{"capital":-180000,"trust":5,"risk":0,"ttl":-10},"feedback":"Adepa moves fast and the MD is pleased. The cost lands in Platform's budget with no line of sight to the waiver, so the deal looks cheaper than it is."},{"key":"B","text":"Offer a self-test kit and two booked clinic slots, and record the cost to serve against Adepa's waiver.","effects":{"capital":-40000,"trust":5,"risk":-3,"ttl":-10},"feedback":"Adepa gets enough help to keep moving at a fraction of the cost of a dedicated environment, and Finance can now see what the waiver really costs. That number will matter at quarter end.","setFlags":["cost_visible"]},{"key":"C","text":"Keep Adepa in the shared certification queue on standard hours, with a written queue position and expected test date.","effects":{"capital":0,"trust":-3,"risk":0,"ttl":5},"feedback":"Fair and defensible, and Adepa grumbles. The written queue position helps it plan, but the launch slips a week."},{"key":"D","text":"Refuse any extra support until fees begin, since Adepa is paying nothing and support at GhIPSS has to follow revenue.","effects":{"capital":0,"trust":-10,"risk":0,"ttl":15},"feedback":"Adepa escalates to the MD, who overrules Platform anyway. Platform loses the relationship and the argument."}]},"N1.2b":{"id":"N1.2b","kind":"branch","round":1,"title":"Price the Tiers","owner":"PLATFORM","ownerDept":"Technology","accounts":["ADEPA"],"modules":{"primary":"M9","secondary":["M1"]},"ccp":"A28","situation":"Finance needs the cost to serve one GIP transaction before it can set the rebate tiers. Platform has three numbers in circulation: the vendor licence cost per transaction, last year's budget divided by volume, and an engineer's estimate on a whiteboard. Finance wants one figure by Wednesday.","data":[{"label":"Vendor licence cost","value":"GHS 0.08 per transaction"},{"label":"Total Platform budget divided by GIP volume","value":"GHS 0.31 per transaction"},{"label":"Whiteboard estimate","value":"\"About GHS 0.20\""},{"label":"Proposed rebate floor","value":"GHS 0.40 per transaction"}],"question":"What does Platform give Finance?","options":[{"key":"A","text":"Both figures, split: GHS 0.08 marginal and GHS 0.31 fully loaded, with the assumptions behind each on one page.","effects":{"capital":200000,"trust":3,"risk":-5,"ttl":0},"feedback":"Finance sets the floor above marginal cost and plans to recover fixed cost through volume. The tiers hold up when the CFO tests them.","setFlags":["unit_cost_known"]},{"key":"B","text":"The licence cost of GHS 0.08, since it is the only cost that rises directly with each extra transaction on the rail.","effects":{"capital":250000,"trust":0,"risk":10,"ttl":0},"feedback":"Useful for setting the floor. On its own it hides the fixed costs someone still has to cover, and Finance does not know that."},{"key":"C","text":"The whiteboard estimate of GHS 0.20, because Finance needs a number by Wednesday and precision can follow next quarter.","effects":{"capital":-100000,"trust":0,"risk":5,"ttl":0},"feedback":"Nobody can explain where the number came from. When the CFO asks, Finance cannot defend the tiers and the decision stalls."},{"key":"D","text":"The fully loaded GHS 0.31, so the floor recovers every Platform cost from day one whatever volume Adepa brings.","effects":{"capital":0,"trust":-5,"risk":0,"ttl":5},"feedback":"Finance raises the floor to GHS 0.50 to be safe. Adepa balks at the new number and the launch slips while terms are reworked."}]},"N1.2c":{"id":"N1.2c","kind":"branch","round":1,"title":"The Certification Queue","owner":"PLATFORM","ownerDept":"Technology","accounts":["ADEPA"],"modules":{"primary":"M3","secondary":["M9","M11"]},"ccp":"A33","situation":"Adepa has gone quiet since Finance's reply. Its CTO now says Adepa will pause the GIP integration and launch first on a direct mobile money route, unless its certification test moves forward by three weeks. Moving it means bumping a community bank already booked into that slot.","data":[{"label":"Adepa's booked test date","value":"Day 40"},{"label":"Community bank's booked test date","value":"Day 19"},{"label":"Adepa forecast at month 6","value":"400,000 GIP transactions a month"},{"label":"Certification team","value":"4 engineers"}],"question":"What does Platform do?","options":[{"key":"A","text":"Hold the line on the queue, since every participant is treated the same and Adepa's threat should not move it forward.","effects":{"capital":-150000,"trust":-8,"risk":0,"ttl":10},"feedback":"Consistent, and Adepa follows through on the threat. Its first 90,000 monthly transactions go live on a route that pays GhIPSS nothing."},{"key":"B","text":"Bump the community bank to Day 40 and give Adepa the Day 19 slot, because Adepa's forecast volume is far larger.","effects":{"capital":350000,"trust":-8,"risk":5,"ttl":-10},"feedback":"Adepa is back on track. The community bank tells two others that GhIPSS queues favour the big names, and the story travels."},{"key":"C","text":"Send Adepa the self-test kit now and offer a pre-certification review on Day 25, so its real test passes first time.","effects":{"capital":250000,"trust":8,"risk":0,"ttl":-10},"feedback":"Adepa's team finds and fixes six defects before its formal test. Nobody is bumped, and Adepa's real path to live gets shorter.","clearFlags":["adepa_cold"]},{"key":"D","text":"Ask the MD to call Adepa's CEO and repair the relationship before Platform changes anything in the test schedule.","effects":{"capital":0,"trust":3,"risk":0,"ttl":5},"feedback":"The call helps the mood and changes nothing in the schedule. Adepa still faces a Day 40 test."}]},"N1.3":{"id":"N1.3","kind":"default","round":1,"title":"The Mandate Backlog","owner":"SERVICE","ownerDept":"Shared Services (document handling)","accounts":["AKWAABA"],"modules":{"primary":"M9","secondary":["M1","M4"]},"ccp":"A28","situation":"Akwaaba Insurance collects premiums by ACH direct debit through Meridian Bank. 31% of this month's debits came back unpaid, most coded \"mandate not received\". Shared Services holds 2,400 paper mandates waiting to be verified and indexed. Akwaaba's finance director has told Meridian that a mobile money biller \"would just work\".","data":[{"label":"Direct debits this month","value":"18,000"},{"label":"Returned","value":"5,580 (31%), of which 3,900 coded mandate not received"},{"label":"Illustrative GhIPSS fee","value":"GHS 0.40 per processed item. Returns earn nothing."},{"label":"Mandate backlog","value":"2,400, clearing about 150 a day"}],"question":"What does Shared Services do?","options":[{"key":"A","text":"Clear the backlog in date order at the current pace, since mandates are processed first in, first out by procedure.","effects":{"capital":-200000,"trust":-5,"risk":0,"ttl":0},"feedback":"The procedure is followed exactly. The backlog takes 16 working days, two more collection cycles fail, and Akwaaba's patience runs out.","setFlags":["mandate_backlog"]},{"key":"B","text":"Bring in three temporary staff for two weeks and clear the whole backlog by value, starting with the largest premiums.","effects":{"capital":100000,"trust":3,"risk":0,"ttl":0},"feedback":"The backlog clears in eight days, largest premiums first. Next month the same incomplete mandates start arriving again."},{"key":"C","text":"Clear the backlog by value and agree a one-page mandate checklist with Meridian to stop incomplete ones arriving.","effects":{"capital":300000,"trust":8,"risk":-3,"ttl":0},"feedback":"The backlog clears and the intake gets fixed. Next month mandate-related returns halve, and Meridian starts using the checklist with two other billers.","setFlags":["mandate_fixed"]},{"key":"D","text":"Return all incomplete mandates to Meridian and tell Akwaaba that the delay sits with its own bank's process.","effects":{"capital":150000,"trust":-10,"risk":0,"ttl":0},"feedback":"Accurate and unhelpful. Meridian is embarrassed in front of its client, and Akwaaba hears that the rail cannot fix its own problems.","setFlags":["mandate_backlog"]}]},"N2.1":{"id":"N2.1","kind":"spine","round":2,"title":"Ticket 4471","owner":"SERVICE","ownerDept":"Shared Services (service desk)","accounts":["UNITY"],"modules":{"primary":"M4","secondary":["M3","M2"]},"ccp":"A31","situation":"The service desk logs its 31st call this month from Unity Trust Bank's branches. This one reads: \"Agents in Tamale say GhanaPay cash-out fails after 6pm. Customers walk to the mobile money agent next door.\" The desk script says confirm the platform is up, log the ticket and close it within 24 hours. The platform was up all evening.","data":[{"label":"Unity Trust GhanaPay agents","value":"600, 41% in the northern regions"},{"label":"Desk tickets closed within 24 hours","value":"96%"},{"label":"Unity agent cash-out volume","value":"Down 18% in six weeks"},{"label":"Unity calls this month that mention the evening","value":"11 of 31"}],"question":"What does the desk do with Ticket 4471?","options":[{"key":"A","text":"Close it within target, since the platform was available and the fault must therefore sit with the bank or its agents.","effects":{"capital":200000,"trust":-8,"risk":0,"ttl":0},"feedback":"The ticket closes in four hours and the desk keeps its 96%. Unity's agents keep losing evening trade, and nobody at GhIPSS can see why volume is falling.","route":"N2.2a","setFlags":["signal_missed"]},{"key":"B","text":"Close it on time, tag it \"evening failure\", and add it to a weekly pattern report for Operations and BD.","effects":{"capital":100000,"trust":3,"risk":0,"ttl":0},"feedback":"The pattern report surfaces the issue a week later. Slower than a trace, and visible to the people who can act.","route":"N2.2b","setFlags":["pattern_report"]},{"key":"C","text":"Escalate it to Unity's relationship manager in BD as a partner complaint, and close the ticket on the desk.","effects":{"capital":100000,"trust":-3,"risk":0,"ttl":0},"feedback":"BD sends it back asking what the technical issue is. The ticket is closed, the problem is open, and ownership has disappeared.","route":"N2.2a","setFlags":["signal_missed"]},{"key":"D","text":"Keep it open, trace three failed cash-outs end to end with Platform, and log the pattern as a revenue signal.","effects":{"capital":150000,"trust":8,"risk":0,"ttl":-5},"feedback":"The trace takes 40 minutes and finds the cause by 3pm. The desk has turned a complaint into a fix that protects volume.","route":"N2.2c"}]},"N2.2a":{"id":"N2.2a","kind":"branch","round":2,"title":"The Variance Question","owner":"CONTROL","ownerDept":"Finance and Strategy","accounts":["UNITY"],"modules":{"primary":"M4","secondary":["M9"]},"ccp":"A28","situation":"Month-end numbers are in. GhanaPay revenue is 22% below budget and Unity Trust Bank is the largest single driver. The CFO wants a one-paragraph explanation for ExCo by tomorrow morning. The easy story is seasonality: harvest money is arriving later in the north this year.","data":[{"label":"GhanaPay revenue against budget","value":"Minus 22%"},{"label":"Unity's share of the shortfall","value":"58%"},{"label":"Unity evening transactions","value":"Down 41%"},{"label":"Unity daytime transactions","value":"Down 3%"}],"question":"What does Finance send ExCo?","options":[{"key":"A","text":"Put the shortfall down to a late harvest season in the north and forecast recovery next quarter, as in past years.","effects":{"capital":100000,"trust":0,"risk":0,"ttl":0},"feedback":"ExCo accepts the story. The real cause keeps running, and next quarter's forecast will miss by more."},{"key":"B","text":"Show ExCo the drop is almost all evening trade, pull Unity's tickets from the desk, and name the likely cause by Friday.","effects":{"capital":200000,"trust":5,"risk":0,"ttl":-5},"feedback":"The split by time of day points straight at the evening failures. Finance has found what the desk missed, a week late and in time.","setFlags":["evening_fix"],"clearFlags":["signal_missed"]},{"key":"C","text":"Recommend cutting GhanaPay's budget for next year to match actual performance, so that forecasts stay credible.","effects":{"capital":-150000,"trust":-5,"risk":0,"ttl":0},"feedback":"The budget falls, and so does the investment that might have fixed the problem. Credibility bought at the cost of growth."},{"key":"D","text":"Report the shortfall as unexplained and ask BD to visit Unity Trust next month to understand its agent network.","effects":{"capital":0,"trust":0,"risk":0,"ttl":0},"feedback":"Honest, and slow. A month passes before anyone looks at the data Finance already had."}]},"N2.2b":{"id":"N2.2b","kind":"branch","round":2,"title":"The Pattern Report","owner":"ENABLEMENT","ownerDept":"Executive Office","accounts":["UNITY"],"modules":{"primary":"M4","secondary":["M2"]},"ccp":"A31","situation":"The desk's first weekly pattern report lands with the Chief of Staff. It shows evening cash-out failures at three banks, Unity Trust the largest. ExCo meets on Monday with a full agenda. The MD's rule is that nothing goes on the agenda without an owner and a number.","data":[{"label":"Banks affected","value":"3"},{"label":"Evening failure tickets in four weeks","value":"46"},{"label":"Estimated GhanaPay transactions lost per month","value":"540,000"},{"label":"Illustrative fee value lost","value":"About GHS 81,000 a month at GHS 0.15 per transaction"}],"question":"What does the Chief of Staff do with it?","options":[{"key":"A","text":"Put it on Monday's agenda with the revenue estimate, Platform named as owner, and a two-week deadline for a fix.","effects":{"capital":300000,"trust":5,"risk":0,"ttl":-5},"feedback":"ExCo spends six minutes on it and Platform leaves with a deadline. The Executive Office turned a report into a decision.","setFlags":["evening_fix"]},{"key":"B","text":"Hold it for another month of data, because ExCo will ask whether three banks over four weeks really prove a trend.","effects":{"capital":50000,"trust":-5,"risk":0,"ttl":0},"feedback":"Another month of evening trade walks next door. When the report reaches ExCo, the number is twice as large.","setFlags":["signal_missed"]},{"key":"C","text":"Send it to BD and Operations for action outside ExCo, since a technical fault should not need executive time.","effects":{"capital":100000,"trust":2,"risk":0,"ttl":0},"feedback":"BD and Operations agree it matters and disagree about who owns it. Progress is slow and nobody is accountable."},{"key":"D","text":"Commission a full root-cause study from the Strategy team, with findings due at the end of the quarter.","effects":{"capital":-100000,"trust":-3,"risk":0,"ttl":5},"feedback":"The study is thorough and arrives after the damage is done. Rigour in the wrong place costs time."}]},"N2.2c":{"id":"N2.2c","kind":"branch","round":2,"title":"The 6pm Cut-off","owner":"PLATFORM","ownerDept":"Technology","accounts":["UNITY"],"modules":{"primary":"M3","secondary":["M10"]},"ccp":"A31","situation":"The trace is clear. Unity Trust's core banking system starts its end-of-day batch at 18:00 and rejects wallet cash-out debits for about 90 minutes. GhIPSS processes every request correctly and Unity's core answers \"system unavailable\". Unity's IT head says the batch window \"has always been there\".","data":[{"label":"Unity end-of-day batch","value":"18:00 to 19:30"},{"label":"Rejected cash-outs per evening","value":"About 1,100"},{"label":"Peak agent cash-out hours in the north","value":"17:00 to 20:00"},{"label":"Other banks with an 18:00 batch","value":"2"}],"question":"What does Platform propose?","options":[{"key":"A","text":"Share the evidence with Unity, propose moving its batch to 22:00, and offer a joint test night with GhIPSS on call.","effects":{"capital":200000,"trust":10,"risk":0,"ttl":-5},"feedback":"Unity's operations head sees the revenue her agents are losing and agrees to the test night. Evening cash-outs recover within a fortnight.","setFlags":["evening_fix"],"requires":{"meter":"trust","op":">=","value":40},"lockedReason":"Locked: Partner Trust below 40. Unity will not open its core banking schedule to GhIPSS right now."},{"key":"B","text":"Tell Unity the fault is in its own core system, and close the GhIPSS side of the investigation with the evidence attached.","effects":{"capital":-100000,"trust":-5,"risk":0,"ttl":0},"feedback":"Correct, and nothing changes. Unity's IT team has no reason to move a batch window that has always been there."},{"key":"C","text":"Build a store-and-forward queue at GhIPSS that holds cash-outs during the batch and releases them at 19:30.","effects":{"capital":350000,"trust":5,"risk":15,"ttl":0},"feedback":"Agents can trade again. GhIPSS now holds cash-outs that are paid out before the debit is confirmed, which is a settlement risk nobody priced."},{"key":"D","text":"Publish an advisory to Unity's agents listing the evening outage window, so customers are told before they queue.","effects":{"capital":0,"trust":3,"risk":0,"ttl":0},"feedback":"Agents stop being surprised. They still lose the evening trade, and so does GhIPSS."}]},"N2.3":{"id":"N2.3","kind":"default","round":2,"title":"At Home and Abroad","owner":"ENABLEMENT","ownerDept":"Brand and Communications","accounts":["SAVANNA"],"modules":{"primary":"M3","secondary":["M1"]},"ccp":"A31","situation":"Savanna Commercial Bank is scaling gh-link issuing and wants a joint campaign. Its draft headline reads: \"gh-link. The only card you need, at home and abroad.\" Savanna's marketing head says the line tested well and the billboards print on Thursday. GhIPSS has no plan for gh-link acceptance outside Ghana.","data":[{"label":"Savanna gh-link cards in issue","value":"85,000, target 250,000"},{"label":"gh-link acceptance","value":"Domestic ATMs and POS"},{"label":"Savanna Visa debit customers","value":"140,000"},{"label":"Campaign budget, funded by Savanna","value":"GHS 600,000"}],"question":"What does Brand and Communications do?","options":[{"key":"A","text":"Approve the campaign as drafted, since Savanna is paying and the line will drive the card numbers both sides want.","effects":{"capital":350000,"trust":5,"risk":20,"ttl":0},"feedback":"Card applications jump in the first week. So does the number of cardholders planning to travel with a card that will not work abroad.","setFlags":["ghlink_claim"]},{"key":"B","text":"Withdraw GhIPSS from the campaign entirely, and leave Savanna to market its own cards in its own way and time.","effects":{"capital":-150000,"trust":-8,"risk":0,"ttl":0},"feedback":"Savanna runs a smaller campaign alone, keeps the headline, and remembers that GhIPSS walked away."},{"key":"C","text":"Rewrite the headline around what gh-link does best, everyday spending at home, and co-sign it before Thursday.","effects":{"capital":200000,"trust":8,"risk":-5,"ttl":0},"feedback":"Savanna gets a campaign that drives domestic use and makes a promise the scheme can keep. The billboards print on time."},{"key":"D","text":"Ask Legal to review the claim first, and keep GhIPSS's logo off the billboards until that review is finished.","effects":{"capital":-50000,"trust":-3,"risk":-5,"ttl":0},"feedback":"GhIPSS is protected and the claim still prints under Savanna's name. The scheme's reputation travels with the card whatever the logo says."}]},"N3.1":{"id":"N3.1","kind":"spine","round":3,"title":"Debited, Not Credited","owner":"PLATFORM","ownerDept":"Technology","accounts":["SAVANNA","AKWAABA"],"modules":{"primary":"M10","secondary":["M2"]},"ccp":"A31","situation":"10:14, Friday. A trader at Savanna Commercial Bank's Kumasi branch sends GHS 8,500 by GIP to a supplier who banks with Meridian. Her account is debited and the supplier is not credited. By 11:30 the desk has 214 similar reports from nine banks. GIP is up, but transfers to Meridian have timed out after debit since its core upgrade at 09:52. Month-end salaries start on Monday.","data":[{"label":"Affected transfers so far","value":"About 3,100, worth GHS 11.4 million"},{"label":"Transfers to Meridian timing out","value":"6%"},{"label":"Meridian status query replies","value":"40 to 90 seconds late"},{"label":"GIP volume today","value":"410,000 transfers"}],"question":"What is Platform's first move?","options":[{"key":"A","text":"Suspend new transfers to Meridian with a clear decline code to stop fresh cases, then work the backlog with Meridian.","effects":{"capital":-100000,"trust":3,"risk":-10,"ttl":0},"feedback":"New failures stop within minutes. Customers now see clean declines in place of silent debits, which is better, and every bank is asking why.","route":"N3.2a"},{"key":"B","text":"Keep the rail fully open and start root-cause analysis with Meridian's IT team before touching anything in production.","effects":{"capital":-300000,"trust":-8,"risk":10,"ttl":0},"feedback":"The analysis is careful and slow. By 14:00 the count has passed 7,900, and fraudsters have noticed.","route":"N3.2b"},{"key":"C","text":"Raise the timeout on Meridian's route in production now to clear the errors, and tell change control afterwards.","effects":{"capital":300000,"trust":3,"risk":15,"ttl":0},"feedback":"The errors drop fast and the room cheers. Nobody has tested what a longer timeout does at month-end volume, and there is now an undocumented change in production.","route":"N3.2b","setFlags":["unapproved_change"]},{"key":"D","text":"Open one incident bridge now with Platform, the service desk, ERC, Comms and Meridian, and update banks every 30 minutes.","effects":{"capital":150000,"trust":8,"risk":-5,"ttl":0},"feedback":"Everyone hears the same facts at the same time. Within an hour the bridge has a containment plan, a holding statement and a reconciliation owner.","route":"N3.2c"}]},"N3.2a":{"id":"N3.2a","kind":"branch","round":3,"title":"What Do We Tell the Market?","owner":"ENABLEMENT","ownerDept":"Brand and Communications","accounts":["SAVANNA","AKWAABA"],"modules":{"primary":"M10","secondary":["M3"]},"ccp":"A31","situation":"Transfers to Meridian are suspended. Customers at every bank now see \"beneficiary bank unavailable\". A screenshot of the error is trending with the caption \"GhIPSS has collapsed again\". Banks' contact centres are asking what to say. Meridian's CEO has asked GhIPSS not to name Meridian publicly.","data":[{"label":"Social posts in two hours","value":"1,400"},{"label":"Banks asking for a customer script","value":"7 of 9"},{"label":"Expected time to restore Meridian","value":"4 to 6 hours"}],"question":"What does Brand and Communications put out?","options":[{"key":"A","text":"Say nothing publicly until service is fully restored, since any statement now could prompt more customers to complain.","effects":{"capital":-250000,"trust":-10,"risk":5,"ttl":0},"feedback":"The silence is filled by screenshots and guesses. By evening the story is that GhIPSS failed and hid it.","setFlags":["silent_incident"]},{"key":"B","text":"Issue a holding statement now: what is affected, that funds are safe, the next update time, and a script for banks.","effects":{"capital":200000,"trust":10,"risk":-5,"ttl":0},"feedback":"Contact centres give one answer, the trend slows within the hour, and Meridian is not named. Every bank on the rail is protected, including the one at fault."},{"key":"C","text":"Post that the issue sits with one participant bank's upgrade, so customers know GhIPSS and GIP are working normally.","effects":{"capital":300000,"trust":-8,"risk":5,"ttl":0},"feedback":"Customers work out which bank within minutes. GhIPSS looks good for an afternoon, and Meridian and its peers remember who pointed."},{"key":"D","text":"Send a private note to all banks' contact centres with a customer script, and keep GhIPSS off social media for now.","effects":{"capital":50000,"trust":3,"risk":0,"ttl":0},"feedback":"Banks are grateful for the script. The public story is still being written by people with screenshots."}]},"N3.2b":{"id":"N3.2b","kind":"branch","round":3,"title":"The Refund Scam","owner":"CONTROL","ownerDept":"Enterprise Risk and Compliance","accounts":["SAVANNA"],"modules":{"primary":"M10","secondary":["M2"]},"ccp":"A31","situation":"With the rail still open, affected transfers pass 7,900 by 14:00. Fraud monitoring picks up calls and messages to affected customers from people claiming to be the \"GhIPSS refunds desk\", asking for PINs and OTPs to \"reverse\" the payment. Two banks report customers who have already shared codes.","data":[{"label":"Affected customers","value":"About 7,900"},{"label":"Scam reports so far","value":"26"},{"label":"Confirmed losses","value":"GHS 41,000"},{"label":"Banks with fraud desks staffed on Friday afternoon","value":"5 of 9"}],"question":"What does ERC do first?","options":[{"key":"A","text":"Report the numbers to the telcos and to law enforcement, and wait for their advice before warning the public.","effects":{"capital":-150000,"trust":-3,"risk":10,"ttl":0},"feedback":"The right agencies are told. The public warning goes out on Monday, after the weekend's losses."},{"key":"B","text":"Treat it as a bank matter, since the customers belong to the banks and fraud on their accounts is theirs to manage.","effects":{"capital":-300000,"trust":-10,"risk":15,"ttl":0},"feedback":"Four banks have nobody on the fraud desk until Monday. The scammers are using GhIPSS's name, and the losses will be remembered that way."},{"key":"C","text":"Ask Platform to suspend transfers to Meridian now to cap the number of affected customers, then brief the banks.","effects":{"capital":50000,"trust":2,"risk":-5,"ttl":0},"feedback":"The affected population stops growing. The 7,900 already exposed still have no warning."},{"key":"D","text":"Alert every bank's fraud desk, publish a \"we never ask for your PIN or OTP\" warning, and log the scam numbers.","effects":{"capital":250000,"trust":8,"risk":-15,"ttl":0},"feedback":"Within the hour every bank is blocking the numbers and the warning is on banks' apps. Reports level off by evening."}]},"N3.2c":{"id":"N3.2c","kind":"branch","round":3,"title":"The Case Log","owner":"SERVICE","ownerDept":"Shared Services (service desk)","accounts":["SAVANNA","AKWAABA"],"modules":{"primary":"M10","secondary":["M2"]},"ccp":"A31","situation":"The bridge is running and the desk owns the case log: 214 tickets from nine banks, each in a different format, and more arriving. Meridian says it can credit or return every timed-out transfer once it has a clean list. The banks want an individual confirmation for each customer.","data":[{"label":"Tickets","value":"214 and rising"},{"label":"Affected transfers per GIP logs","value":"About 3,100"},{"label":"Ticket formats in use by banks","value":"9"},{"label":"Meridian's request","value":"One file, one format"}],"question":"How does the desk run reconciliation?","options":[{"key":"A","text":"Work every ticket individually in the order received, confirming each case back to the reporting bank as it closes.","effects":{"capital":0,"trust":3,"risk":0,"ttl":0},"feedback":"Thorough and slow. By Saturday evening the desk has closed 140 tickets and Meridian is still waiting for a list."},{"key":"B","text":"Build one master list from the GIP logs, send Meridian a single file, then send each bank its own confirmation list.","effects":{"capital":300000,"trust":8,"risk":-5,"ttl":0},"feedback":"Meridian credits or returns every transfer by Saturday noon. Every bank gets a clean list for its customers, including transfers its customers never reported."},{"key":"C","text":"Ask each bank to raise its own claim with Meridian directly, since the transfers moved between those two banks.","effects":{"capital":-250000,"trust":-10,"risk":5,"ttl":0},"feedback":"Meridian receives nine lists in nine formats and processes none of them by Monday. The banks blame the switch in the middle."},{"key":"D","text":"Wait for Meridian to finish its own reconciliation, then match GhIPSS tickets to Meridian's file once it arrives.","effects":{"capital":-100000,"trust":-3,"risk":0,"ttl":0},"feedback":"Meridian is reconciling from a core system that has just failed. Its file arrives on Monday and does not match the logs."}]},"N3.3":{"id":"N3.3","kind":"default","round":3,"title":"Who Pays?","owner":"CONTROL","ownerDept":"Legal","accounts":["SAVANNA","AKWAABA"],"modules":{"primary":"M10","secondary":["M3"]},"ccp":"A31","situation":"Service is restored by 17:40 and every affected transfer is credited or returned by Saturday noon. On Monday, Sa
