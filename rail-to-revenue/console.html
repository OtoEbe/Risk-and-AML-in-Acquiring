/* ---------- rehearsal: simulated teams ---------- */
const BOT_NAMES = ["Volta Squad", "Kente Crew", "Harmattan Desk", "Baobab Bench", "Coastline Cell", "Savannah Six"];
const BOT_POLICY = [
  { best: 0.62, strong: 0.25, weak: 0.09, poor: 0.04 }, { best: 0.4, strong: 0.3, weak: 0.2, poor: 0.1 }, "greedy",
  { best: 0.45, strong: 0.35, weak: 0.15, poor: 0.05 }, { best: 0.3, strong: 0.3, weak: 0.25, poor: 0.15 }, { best: 0.25, strong: 0.25, weak: 0.25, poor: 0.25 },
];
const BOTS = {
  speed: 2, paused: false, next: {},
  init(s) { Object.values(s.teams).forEach((t) => { t.counts = { PLATFORM: 2, CONTROL: 1 + (t.number % 2), ENABLEMENT: 1, SERVICE: 1 + ((t.number + 1) % 2) }; }); saveDb(); },
  inject(t, id) {
    if (t.events.some((e) => e.type === "inject" && e.injectId === id)) return;
    try { const st = ENGINE.replay(C.full, t.events); if (st.status !== "playing") return; } catch (e) { return; }
    t.events.push({ id: uuid(), type: "inject", injectId: id, at: Date.now() });
  },
  tick() {
    const s = S();
    if (!s || !s.rehearsal || BOTS.paused || !C.full) return;
    let changed = false;
    Object.values(s.teams).forEach((t) => {
      const st = ENGINE.replay(C.full, t.events);
      if (st.status !== "playing" || st.round > s.openRound) return;
      const k = s.code + ":" + t.number, now = Date.now();
      if (!BOTS.next[k]) { BOTS.next[k] = now + (2500 + Math.random() * 6000) / BOTS.speed; return; }
      if (now < BOTS.next[k]) return;
      BOTS.next[k] = 0;
      const node = nodeOf(C.full, st.presented), open = ENGINE.optionsFor(C.full, st, st.presented).filter((o) => !o.locked).map((o) => node.options.find((x) => x.key === o.key));
      const pol = BOT_POLICY[(t.number - 1) % BOT_POLICY.length];
      let pick;
      if (pol === "greedy") pick = open.slice().sort((a, b) => b.effects.capital - a.effects.capital)[0];
      else {
        const w = open.map((o) => pol[o.quality] || 0.01), tot = w.reduce((a, b) => a + b, 0);
        let r = Math.random() * tot; pick = open[open.length - 1];
        for (let i = 0; i < open.length; i++) { r -= w[i]; if (r <= 0) { pick = open[i]; break; } }
      }
      if (st.lifelinesUsed < 2 && Math.random() < 0.06) t.events.push({ id: uuid(), type: "lifeline", at: now });
      t.events.push({ id: uuid(), type: "choose", nodeId: st.presented, optionKey: pick.key, at: now });
      t.updatedAt = now; changed = true;
    });
    if (changed) { saveDb(); if (!IS_SCREEN && (C.tab === "room" || C.tab === "pace")) { if (C.tab === "room" && C.scanStop) refreshRoomTable(); else route(); } }
  },
};

    const r = C.full.rounds[Math.max(1, Math.min(5, s.openRound || 1)) - 1];
    const v = knownTeams(s).map(teamView);
    const settled = v.filter((x) => x.state.status === "finished" || x.state.round > (s.openRound || 1)).length;
    const sc = s.showCode, code = sc && sc.kind === "release" ? sessionCodes(s.code, s.teamCount).release[sc.round] : null;
    return `<section class="scr scr-round"><div class="sr-l"><div class="sr-k">${s.openRound ? `Round ${r.number} of 5` : "Before Round 1"}</div><h1>${esc(r.title)}</h1><div class="sr-d">${esc(r.days)}</div>
      ${code ? `<div class="sr-code"><span>Round ${sc.round} release code</span><b class="num">${code}</b></div>` : ""}
      ${v.length ? `<div class="sr-set">${settled} of ${v.length} tables settled${s.rehearsal ? "" : " at last scan"}</div>` : ""}</div>
      <div class="sr-r"><div class="sr-timer num" id="scrTimer">${fmtClock(timerLeft(s))}</div><div class="sr-map" id="scrMap"></div></div></section>`;
  },
  board(s) {
    const st = standings(s);
    const top = st.length ? Math.max.apply(null, st.map((v) => v.state.capital)) : 1, lo = Math.min(9000000, ...st.map((v) => v.state.capital));
    return `<section class="scr scr-board"><h1>Leaderboard</h1><div class="sb-sub">${st.every((v) => v.state.status === "finished") && st.length ? "Final" : `After Round ${Math.max(1, s.openRound - 1)}${s.rehearsal ? "" : ", at last scan"}`}</div>
      <ol class="sb-list">${st.map((v, i) => `<li style="--w:${(10 + 90 * (v.state.capital - lo) / Math.max(1, top - lo)).toFixed(1)}%"><span class="sb-rank num">${i + 1}</span><span class="sb-name">${esc(v.t.name)}</span>
        <span class="sb-bar"><i></i></span><span class="sb-cap num">${fmtM(v.state.capital)}</span><span class="sb-m num">Trust ${v.state.trust}<br>Risk ${v.state.risk}<br>TTL ${v.state.ttl}</span></li>`).join("")}</ol></section>`;
  },
  reveal(s) {
    const step = s.screen.reveal || 0, rec = recognitions(s);
    if (step === 0) return `<section class="scr scr-reveal"><div class="rv-in"><div class="rv-k">The quarter is over</div><h1>Who earned what, and why</h1></div></section>`;
    if (step <= 4) {
      const x = rec[step - 1];
      if (!x) return `<section class="scr scr-reveal"><h1>No results yet</h1></section>`;
      return `<section class="scr scr-reveal"><canvas id="confetti"></canvas><div class="rv-in"><div class="rv-k">${esc(x.r.rule)}</div><h1 class="rv-award">${esc(x.r.name)}</h1><div class="rv-team">${esc(x.v.t.name)}</div><div class="rv-stat num">${esc(x.stat(x.v))}</div></div></section>`;
    }
    return SCREEN.board(s);
  },
  replay(s) {
    const rp = s.screen.replay || defaultReplay(s);
    if (!rp) return `<section class="scr"><h1>Two paths</h1><p>Needs two tables.</p></section>`;
    return `<section class="scr scr-replay"><h1>Two paths</h1>${replayTable(s, rp, true)}</section>`;
  },
  echoes(s) {
    return `<section class="scr scr-echo"><h1>The echoes</h1><p class="se-sub">${esc(C.full.config.finalSettlement.autoResolve)}</p>${echoTable(s)}</section>`;
  },
  clock() {
    const s = SCREEN.sess(); if (!s) return;
    const el = $("#scrTimer"); if (!el) return;
    const left = timerLeft(s), sec = Math.ceil(left / 1000);
    el.textContent = fmtClock(left);
    el.classList.toggle("low", s.timer.running && left < 60000);
    el.classList.toggle("zero", left <= 0);
    if (s.timer.running && sec <= 10 && sec > 0 && sec !== SCREEN.lastTick) { SCREEN.lastTick = sec; SOUND.tick(); }
    const tk = "t" + s.timer.endsAt;
    if (left <= 0 && s.timer.endsAt && SCREEN.chimed !== tk && (s.timer.running || s.timer.remaining === 0)) { SCREEN.chimed = tk; SOUND.chime(); }
  },
  confetti(n) {
    const cv = $("#confetti"); if (!cv || (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
    const ctx = cv.getContext("2d"), W = (cv.width = innerWidth), H = (cv.height = innerHeight);
    const cols = ["#12CC6F", "#2B4DF7", "#FFFFFF", "#1F7A72", "#F2B84B"];
    const ps = Array.from({ length: n }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, c: cols[Math.floor(Math.random() * cols.length)], w: 8 + Math.random() * 8 }));
    let f = 0;
    const draw = () => {
      ctx.clearRect(0, 0, W, H);
      ps.forEach((p) => { p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); ctx.restore(); });
      if (++f < 260 && cv.isConnected) requestAnimationFrame(draw);
    };
    draw();
  },
};

/* ---------- boot ---------- */
(async function boot() {
  if (location.protocol === "http:" && !/^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname)) { location.replace("https:" + location.href.slice(5)); return; }
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
  let pin = null;
  try { pin = (window.opener && window.opener.CONSOLE && window.opener.CONSOLE.pin) || sessionStorage.getItem("r2r_pin"); } catch (e) { pin = null; }
  if (pin) { try { await unlockWith(pin); } catch (e) { renderUnlock($("#croot")); } }
  else renderUnlock($("#croot"));
  if (!IS_SCREEN) {
    setInterval(() => { BOTS.tick(); consoleTick(); }, 400);
    window.addEventListener("storage", (e) => { if (e.key === "r2r_console" && C.full) { loadDb(); if (!C.scanStop) route(); } });
  }
})();

</script>
</body>
</html>
